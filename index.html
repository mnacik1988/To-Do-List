/* ── Drag-and-drop (desktop, HTML5) ── */
var appEl=document.getElementById('app');
var dragHandlePressed=false;
appEl.addEventListener('mousedown',function(e){ dragHandlePressed=!!e.target.closest('[data-role="drag-handle"]'); });
appEl.addEventListener('dragstart',function(e){
  if(!dragHandlePressed){ e.preventDefault(); return; }
  var row=e.target.closest('[data-role="task-row"]'); if(!row) return;
  drag={section:row.dataset.sec,id:row.dataset.id}; e.dataTransfer.effectAllowed='move'; render();
});
appEl.addEventListener('dragover',function(e){
  var row=e.target.closest('[data-role="task-row"]'); if(!row) return; e.preventDefault();
  var sec=row.dataset.sec,id=row.dataset.id; if(!drag||drag.section!==sec||drag.id===id) return;
  var arr=state.sections[sec].slice(); var from=-1,to=-1;
  for(var i=0;i<arr.length;i++){if(arr[i].id===drag.id)from=i;if(arr[i].id===id)to=i;}
  if(from<0||to<0) return; var moved=arr.splice(from,1)[0]; arr.splice(to,0,moved); state.sections[sec]=arr;
  var list=document.getElementById('task-list');
  if(list) list.innerHTML=arr.map(function(t){return renderTaskRow(t,sec);}).join('');
});
document.addEventListener('dragend',function(){ if(!drag) return; drag=null; render(); });

/* ── Touch drag (mobile) ── */
var touchDrag=null, touchClone=null;

appEl.addEventListener('contextmenu',function(e){
  if(e.target.closest('[data-role="drag-handle"]')||e.target.closest('[data-role="task-row"]')) e.preventDefault();
});

appEl.addEventListener('touchstart',function(e){
  var handle=e.target.closest('[data-role="drag-handle"]'); if(!handle) return;
  e.preventDefault();
  var row=handle.closest('[data-role="task-row"]'); if(!row) return;
  var rect=row.getBoundingClientRect();
  touchDrag={section:handle.dataset.sec,id:handle.dataset.id,row:row,wrap:row.closest('.task-row-wrap')||row,startY:e.touches[0].clientY,offsetY:e.touches[0].clientY-rect.top,targetId:null,moved:false};
  touchClone=row.cloneNode(true);
  touchClone.className=touchClone.className+' touch-clone';
  touchClone.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;z-index:200;display:none;';
  document.body.appendChild(touchClone);
},{passive:false});

document.addEventListener('touchmove',function(e){
  if(!touchDrag) return;
  var y=e.touches[0].clientY;
  if(!touchDrag.moved){
    if(Math.abs(y-touchDrag.startY)<6) return;
    touchDrag.moved=true;
    touchDrag.wrap.style.opacity='0.5';
    touchDrag.wrap.style.transform='scale(0.98)';
    touchClone.style.display='';
  }
  e.preventDefault();
  touchClone.style.top=(y-touchDrag.offsetY)+'px';
  /* find target */
  var list=document.getElementById('task-list'); if(!list) return;
  var rows=list.querySelectorAll('[data-role="task-row"]');
  var targetId=null, firstOtherId=null;
  rows.forEach(function(r){
    if(r.dataset.id===touchDrag.id) return;
    if(firstOtherId===null) firstOtherId=r.dataset.id;
    var rect=r.getBoundingClientRect();
    if(y>rect.top) targetId=r.dataset.id;
    r.style.borderBottom=''; r.style.borderTop='';
  });
  // Палец выше вообще всех строк (тащим задачу на самое первое место) — раньше
  // targetId в этом случае оставался null НАВСЕГДА, и touchend просто ничего
  // не делал: перетащить задачу в начало списка было невозможно, хотя вниз, к
  // последней позиции, всё работало (там цель находится всегда — последняя
  // строка). Найдено по жалобе Александра «вверх тянется плохо, вниз хорошо»
  // (2026-08-14). Отдельный флаг dropAtTop покрывает именно этот случай.
  touchDrag.dropAtTop=(!targetId&&!!firstOtherId);
  if(touchDrag.dropAtTop){
    var fEl=list.querySelector('[data-id="'+firstOtherId+'"]'); if(fEl) fEl.style.borderTop='2px solid var(--accent)';
  } else if(targetId){
    var tEl=list.querySelector('[data-id="'+targetId+'"]'); if(tEl) tEl.style.borderBottom='2px solid var(--accent)';
  }
  touchDrag.targetId=targetId;
},{passive:false});

document.addEventListener('touchend',function(){
  if(!touchDrag) return;
  var sec=touchDrag.section; var arr=state.sections[sec].slice();
  var fromIdx=-1;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===touchDrag.id) fromIdx=i; }
  if(fromIdx>=0&&touchDrag.dropAtTop){
    var movedTop=arr.splice(fromIdx,1)[0];
    arr.unshift(movedTop);
    state.sections[sec]=arr;
  } else {
    var toIdx=-1;
    for(var j=0;j<arr.length;j++){ if(arr[j].id===touchDrag.targetId) toIdx=j; }
    if(fromIdx>=0&&toIdx>=0&&fromIdx!==toIdx){
      var moved=arr.splice(fromIdx,1)[0];
      arr.splice(toIdx+(fromIdx<toIdx?0:1),0,moved);
      state.sections[sec]=arr;
    }
  }
  if(touchDrag.wrap){ touchDrag.wrap.style.opacity=''; touchDrag.wrap.style.transform=''; }
  if(touchClone){ touchClone.remove(); touchClone=null; }
  touchDrag=null; render();
},{passive:true});

/* ── Long-press → выбор + swipe влево → удалить (mobile) ── */
var pressTimer=null, swipe=null, openSwipeEl=null, suppressClick=false;

function closeSwipe(){
  if(!openSwipeEl) return;
  var r=openSwipeEl.querySelector&&openSwipeEl.querySelector('[data-role="task-row"]');
  if(r){
    r.style.transition='transform .2s'; r.style.transform='translateX(0)';
    setTimeout(function(){ r.classList.remove('swiping'); },200);
  }
  openSwipeEl=null;
}

appEl.addEventListener('touchstart',function(e){
  if(openSwipeEl && !openSwipeEl.contains(e.target)) closeSwipe();
  if(state.selectMode) return;
  if(e.target.closest('[data-role="drag-handle"]')) return;
  var row=e.target.closest('[data-role="task-row"]'); if(!row) return;
  var t=e.touches[0];
  swipe={row:row,wrap:row.closest('.task-row-wrap'),startX:t.clientX,startY:t.clientY,dx:0,active:false,id:row.dataset.id,sec:row.dataset.sec};
  if(pressTimer) clearTimeout(pressTimer);
  pressTimer=setTimeout(function(){
    if(swipe && !swipe.active){
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_e){} }
      var s=swipe; swipe=null;
      suppressClick=true; setTimeout(function(){ suppressClick=false; },500);
      closeSwipe();
      enterSelectMode();
      toggleSelectTask(s.id,s.sec);
    }
  },450);
},{passive:true});

document.addEventListener('touchmove',function(e){
  if(!swipe) return;
  var t=e.touches[0];
  var dx=t.clientX-swipe.startX, dy=t.clientY-swipe.startY;
  if(!swipe.active){
    if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)+4){
      swipe.active=true;
      if(pressTimer) clearTimeout(pressTimer);
      swipe.row.style.transition='none';
      swipe.row.classList.add('swiping');
    } else if(Math.abs(dy)>10){
      if(pressTimer) clearTimeout(pressTimer);
      swipe=null; return;
    } else { return; }
  }
  e.preventDefault();
  var x=Math.min(0,dx);
  if(x<-96) x=-96+(x+96)*0.35;
  swipe.dx=x;
  swipe.row.style.transform='translateX('+x+'px)';
},{passive:false});

document.addEventListener('touchend',function(){
  if(pressTimer) clearTimeout(pressTimer);
  if(!swipe) return;
  var s=swipe; swipe=null;
  if(!s.active) return;
  suppressClick=true; setTimeout(function(){ suppressClick=false; },400);
  s.row.style.transition='transform .2s';
  if(s.dx<-48){
    s.row.style.transform='translateX(-88px)';
    openSwipeEl=s.wrap;
  } else {
    s.row.style.transform='translateX(0)';
    if(openSwipeEl===s.wrap) openSwipeEl=null;
    setTimeout(function(){ s.row.classList.remove('swiping'); },200);
  }
},{passive:true});

/* ── Свайп-вниз по шторке настроек = закрыть ──
   Тянем шторку за пределы, только если внутренний скролл уже вверху
   (иначе жест down = обычная прокрутка контента). Не конфликтует с
   обработчиками задач: у них триггер — [data-role="task-row"], которого
   в шторке нет, поэтому переменная swipe там всегда null. */
var sheetDrag=null;
document.addEventListener('touchstart',function(e){
  var sheet=e.target.closest('.sheet[data-sheet-drag]');
  if(!sheet){ sheetDrag=null; return; }
  sheetDrag={ sheet:sheet, body:sheet.querySelector('.sheet-body'), startY:e.touches[0].clientY, dy:0, active:false, key:sheet.getAttribute('data-sheet-drag') };
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!sheetDrag) return;
  var dy=e.touches[0].clientY-sheetDrag.startY;
  if(!sheetDrag.active){
    if(dy>6 && (!sheetDrag.body || sheetDrag.body.scrollTop<=0)){
      sheetDrag.active=true; sheetDrag.sheet.style.transition='none';
    } else if(dy<-4 || (sheetDrag.body && sheetDrag.body.scrollTop>0)){
      sheetDrag=null; return;   // отдаём жест внутренней прокрутке
    } else { return; }
  }
  if(dy<0) dy=0;
  sheetDrag.dy=dy;
  e.preventDefault();
  sheetDrag.sheet.style.transform='translateY('+dy+'px)';
},{passive:false});
document.addEventListener('touchend',function(){
  if(!sheetDrag) return;
  var s=sheetDrag; sheetDrag=null;
  if(!s.active) return;
  if(s.dy>90){
    // Плавно доедет вниз от текущей точки протяжки + затухание фона, потом
    // уберёт из DOM — каждый ключ закрывается своей штатной функцией, чтобы
    // не терять их собственную логику очистки состояния (таймеры записи и т.п.).
    if(s.key==='settings') closeSettings();

  }
},{passive:true});

/* ── Push-подписка ── */
function urlB64toUint8(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='=';
  var raw=atob(str); var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr;
}
// pushActive — есть активная push-подписка → системные уведомления шлёт
// сервер. Проблема: это чисто внутрипамятный флаг, который становится true
// ТОЛЬКО после того как асинхронная цепочка subscribePush() успеет
// отработать — а checkReminders() может выполниться РАНЬШЕ (типичный сценарий
// 2026-07-24: тап по уведомлению холодным стартом открывает приложение,
// visibilitychange сразу зовёт checkReminders(), но subscribePush() к этому
// моменту ещё не успел подтвердить подписку) — тогда pushActive всё ещё
// false, checkReminders() считает "push не активен" и шлёт ЛОКАЛЬНОЕ
// уведомление ПОВЕРХ уже доставленного сервером — задваивание. wasPushOk()
// читает флаг, сохранённый в прошлый успешный раз (переживает перезагрузку,
// доступен СИНХРОННО с первого же вызова) — если push хоть раз уже работал
// на этом устройстве, считаем что сервер справится и в этот раз тоже.
var pushActive=false;
function wasPushOk(){ try{ return localStorage.getItem('vtodo-push-was-ok')==='1'; }catch(e){ return false; } }
function subscribePush(){
  if(!VAPID_PUBLIC_KEY||!('PushManager' in window)||!('serviceWorker' in navigator)){
    state.pushStatus='unsupported'; render(); return;
  }
  // /subscribe теперь требует Google-вход (2026-07-14) — раньше подписка
  // писалась под случайным device-id без проверки владельца.
  if(!isGoogleSignedIn()){ state.pushStatus='needAuth'; render(); return; }
  navigator.serviceWorker.ready.then(function(reg){
    reg.pushManager.getSubscription().then(function(existing){
      var send=function(sub){
        pushActive=true;
        try{ localStorage.setItem('vtodo-push-was-ok','1'); }catch(e){}
        fetch(WORKER_URL+'/subscribe',{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+getGoogleToken()},
          body:JSON.stringify({subscription:sub.toJSON(),deviceId:getDeviceId(),lang:state.lang})
        }).then(function(r){ if(r&&r.ok){ state.pushStatus='ok'; } else { state.pushStatus='error'; } render(); })
          .catch(function(){ state.pushStatus='error'; render(); });
      };
      if(existing){ send(existing); return; }
      if(Notification.permission!=='granted') return;
      reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64toUint8(VAPID_PUBLIC_KEY)})
        .then(send)
        .catch(function(e){ state.pushStatus='error'; render(); });
    });
  }).catch(function(e){ state.pushStatus='error'; render(); });
}
var syncRemindersTimer=null;
function syncRemindersToServer(){
  if(syncRemindersTimer) clearTimeout(syncRemindersTimer);
  syncRemindersTimer=setTimeout(doSyncRemindersToServer,1500);
}
// Раньше здесь был отдельный клиентский диффинг + POST /remind,/unremind —
// КАЖДОЕ устройство само регистрировало СВОЁ напоминание, что требовало
// сначала подтянуть задачу через pull. Если второе устройство не успевало
// открыться до срока напоминания — оно физически не могло зарегистрироваться
// вовремя, и push туда не приходил (найдено 2026-07-24 по жалобе: короткое
// напоминание долетело только на устройство-создатель).
// РЕШЕНИЕ: сервер теперь сам заводит напоминание сразу на ВСЕ подписанные
// устройства аккаунта прямо при записи /task (см. fanoutReminder в
// cloudflare-worker.js) — открывать второе устройство больше не нужно.
// taskSyncSig() уже включает reminderTime, так что любое изменение
// напоминания и так уходит на сервер через обычный синк задач — отдельный
// путь /remind,/unremind стал не нужен, эндпоинты на сервере оставлены
// нетронутыми (безопасно, просто больше не вызываются отсюда).
function doSyncRemindersToServer(){
  syncRemindersTimer=null;
  doSyncTasksToServer();
}

/* ── Синхронизация задач между СВОИМИ устройствами (2026-07-24) ──
   Личная синхронизация: задачи одного Google-аккаунта видны на всех его
   устройствах (телефон+планшет, Android+iPhone) — заодно страховка данных
   на случай будущего перехода на нативное приложение. НЕ общий список для
   разных людей — это отдельная будущая фича.
   Тот же приём диффинга, что у напоминаний выше — пишем в KV только когда
   содержимое реально изменилось (та самая квота записи, что мы уже дважды
   сжигали в этом проекте).
   syncId (НЕ совпадает с локальным id!) — устройство-независимая identity
   задачи: локальные id генерируются на каждом устройстве отдельно и
   неизбежно совпадают между устройствами (см. UID_HWM_KEY выше — без
   монотонного счётчика syncId мог бы столкнуться после удаления всех
   локальных задач). */
var SYNC_TASK_KEY='vtodo-task-synced-v1';
function getSyncedTasks(){ try{ return JSON.parse(localStorage.getItem(SYNC_TASK_KEY)||'{}'); }catch(e){ return {}; } }
function saveSyncedTasks(m){ try{ localStorage.setItem(SYNC_TASK_KEY,JSON.stringify(m)); }catch(e){} }
// Страховка от случайного удаления при синке (2026-08-15, жалоба Александра
// — вся задача с чек-листом пропала на iPhone+Android без его участия).
// Раньше "пропавшая локально" задача получала НАСТОЯЩЕЕ надгробие на
// сервере уже на ПЕРВОЙ же проверке (doSyncTasksToServer с дебаунсом всего
// 1.5с) — любая мимолётная нестыковка состояния (гонка рендера, отложенный
// pull с другого устройства, да что угодно — мы уже ловили в этом файле
// похожую гонку с дублированием голосовых задач) необратимо удаляла задачу
// СРАЗУ и ВЕЗДЕ, на всех устройствах. Теперь отсутствие задачи должно
// подтвердиться в течение 5 минут (тот же запас, что REMINDER_WINDOW_MS на
// сервере) — если задача за это время "вернулась" (например, реально была
// временной нестыковкой), удаление отменяется без следа.
var PENDING_DELETE_KEY='vtodo-pending-delete', PENDING_DELETE_GRACE_MS=300000;
function getPendingDeletes(){ try{ return JSON.parse(localStorage.getItem(PENDING_DELETE_KEY)||'{}'); }catch(e){ return {}; } }
function savePendingDeletes(m){ try{ localStorage.setItem(PENDING_DELETE_KEY,JSON.stringify(m)); }catch(e){} }
// Явное удаление пользователем — ОТДЕЛЬНО от «задача куда-то делась».
// В этом и была ошибка исходной задумки (2026-08-18): выдержка вводилась
// против МОЛЧАЛИВОГО исчезновения задачи из-за гонки, но применялась и к
// осознанному нажатию «Удалить». А раз надгробие откладывалось, задача
// оставалась на сервере — и pullTasksFromServer при первом же обращении
// не находил её локально и ВОСКРЕШАЛ. После чего сработка «задача
// вернулась» отменяла удаление навсегда. Симптомы Александра ровно эти:
// «в других версиях не удаляется» и «задачи потом снова появляются».
// Теперь явное удаление уходит немедленно, а выдержка остаётся только для
// случая, ради которого задумывалась.
var EXPLICIT_DELETE_KEY='vtodo-explicit-delete';
function getExplicitDeletes(){ try{ return JSON.parse(localStorage.getItem(EXPLICIT_DELETE_KEY)||'{}'); }catch(e){ return {}; } }
function saveExplicitDeletes(m){ try{ localStorage.setItem(EXPLICIT_DELETE_KEY,JSON.stringify(m)); }catch(e){} }
// Зовётся ДО удаления из state — потом syncId уже не достать.
function markExplicitDelete(pred){
  var m=getExplicitDeletes(), changed=false;
  allTasks().forEach(function(t){
    if(!pred(t)) return;
    if(!t.syncId) return; // на сервер не попадала — удалять там нечего
    m[t.syncId]=Date.now(); changed=true;
  });
  if(changed) saveExplicitDeletes(m);
}
// Выдержка в 5 минут была бы бесполезна без ЭТОГО: сама по себе она только
// откладывает надгробие, а перепроверить его потом некому — периодического
// синка задач в приложении нет, и холодный старт задачи наверх не отправляет.
// Из-за этого удаление уходило на сервер, только если пользователь случайно
// свернёт и развернёт приложение позже чем через 5 минут; иначе задача
// оставалась жить на других устройствах навсегда (жалоба Александра
// 2026-08-18: «удаляю в нативной — в других версиях не удаляется»).
// Планируем один отложенный повтор синка, когда выдержка истечёт.
var pendingDeleteTimer=null;
function schedulePendingDeleteSweep(){
  if(pendingDeleteTimer) return; // повтор уже запланирован
  pendingDeleteTimer=setTimeout(function(){
    pendingDeleteTimer=null;
    doSyncTasksToServer(); // он сам решит, истекла ли выдержка, и при нужде запланирует ещё раз
  }, PENDING_DELETE_GRACE_MS+5000);
}
// Сигнатура СОДЕРЖИМОГО задачи (фиксированный порядок полей — JSON.stringify
// объектного литерала детерминирован) — по ней решаем, изменилась ли задача
// с последнего успешного синка.
function taskSyncSig(t){
  return JSON.stringify({text:t.text,desc:t.desc,priority:t.priority,date:t.date,reminderTime:t.reminderTime,checklist:t.checklist,done:t.done});
}
function findTaskBySyncId(sid){
  var all=allTasks();
  for(var i=0;i<all.length;i++){ if(all[i].syncId===sid) return all[i]; }
  return null;
}
function removeTaskBySyncIdFromState(sid){
  for(var sec in state.sections){
    state.sections[sec]=state.sections[sec].filter(function(t){ return t.syncId!==sid; });
  }
}

function doSyncTasksToServer(){
  if(!navigator.onLine||!isGoogleSignedIn()) return;
  var authHeaders={'content-type':'application/json','Authorization':'Bearer '+getGoogleToken()};
  var synced=getSyncedTasks();
  var desired={};
  var assignedNew=false;
  allTasks().forEach(function(task){
    // Присваиваем syncId лениво, при первой попытке синка — детерминированно
    // (deviceId+localId), так что даже если запрос прервётся, повтор не
    // создаст дубликат на сервере.
    if(!task.syncId){ task.syncId=getDeviceId()+'-'+task.id; assignedNew=true; }
    desired[task.syncId]=task;
  });
  if(assignedNew) saveStorage();
  Object.keys(desired).forEach(function(sid){
    var task=desired[sid];
    var sig=taskSyncSig(task);
    var prev=synced[sid];
    if(prev && prev.sig===sig) return; // не менялось с прошлого успешного синка
    if(!task.updatedAt || !prev || prev.sig!==sig) task.updatedAt=Date.now();
    // ts считаем ЗДЕСЬ, на клиенте, в часовом поясе пользователя — сервер
    // (Cloudflare Worker) всегда работает в UTC, и new Date('...T14:17') там
    // означало бы 14:17 UTC, а не 14:17 по местному времени (нашли живьём
    // 2026-07-24: fan-out напоминаний регистрировался с ts, сдвинутым на
    // разницу с UTC — уведомления "никуда не приходили", т.к. реально ждали
    // неправильного момента).
    var taskTs=(task.date&&task.reminderTime)?new Date(task.date+'T'+task.reminderTime).getTime():0;
    fetch(WORKER_URL+'/task',{method:'POST',headers:authHeaders,
      // lang — чтобы push-уведомление пришло на языке приложения: текст
      // напоминания собирает СЕРВЕР (см. sendDueReminders в воркере), и без
      // этого поля он знал только русский (аудит 2026-08-17, п.№6).
      body:JSON.stringify({syncId:sid,deviceId:getDeviceId(),updatedAt:task.updatedAt,
        text:task.text,desc:task.desc,priority:task.priority,done:task.done,
        date:task.date,reminderTime:task.reminderTime,checklist:task.checklist,ts:taskTs,
        lang:state.lang})
    }).then(function(r){ if(r&&r.ok){ var s=getSyncedTasks(); s[sid]={sig:sig,updatedAt:task.updatedAt}; saveSyncedTasks(s); } }).catch(function(){});
  });
  /* Пропавшие локально задачи → надгробие на сервере.
     ЯВНОЕ удаление (пользователь нажал «Удалить») уходит немедленно: намерение
     однозначное, ждать нечего. НЕЯВНОЕ (задача просто исчезла из state — гонка
     рендера, кривой merge и т.п.) по-прежнему выдерживается PENDING_DELETE_GRACE_MS,
     ради чего выдержка и вводилась в v1.34. Смешивать эти два случая было
     ошибкой: см. большой комментарий у EXPLICIT_DELETE_KEY. */
  var pending=getPendingDeletes(), pendingChanged=false, now=Date.now();
  var explicit=getExplicitDeletes(), explicitChanged=false;
  function sendTombstone(sid){
    fetch(WORKER_URL+'/task/delete',{method:'POST',headers:authHeaders,
      body:JSON.stringify({syncId:sid,deviceId:getDeviceId(),updatedAt:Date.now()})
    }).then(function(r){ if(r&&r.ok){ var s=getSyncedTasks(); delete s[sid]; saveSyncedTasks(s); } }).catch(function(){});
  }
  Object.keys(synced).forEach(function(sid){
    if(desired[sid]){
      // Задача на месте — снимаем оба вида пометок.
      if(pending[sid]!==undefined){ delete pending[sid]; pendingChanged=true; }
      if(explicit[sid]!==undefined){ delete explicit[sid]; explicitChanged=true; }
      return;
    }
    if(explicit[sid]!==undefined){
      delete explicit[sid]; explicitChanged=true;
      if(pending[sid]!==undefined){ delete pending[sid]; pendingChanged=true; }
      sendTombstone(sid); return;
    }
    if(pending[sid]===undefined){ pending[sid]=now; pendingChanged=true; return; } // впервые заметили пропажу — ждём
    if(now-pending[sid]<PENDING_DELETE_GRACE_MS) return;                            // ещё не истекло
    delete pending[sid]; pendingChanged=true;
    sendTombstone(sid);
  });
  // Убираем пометки для того, чего больше нет даже в synced (стёрлось иначе).
  Object.keys(pending).forEach(function(sid){ if(!synced[sid]){ delete pending[sid]; pendingChanged=true; } });
  Object.keys(explicit).forEach(function(sid){ if(!synced[sid]){ delete explicit[sid]; explicitChanged=true; } });
  if(pendingChanged) savePendingDeletes(pending);
  if(explicitChanged) saveExplicitDeletes(explicit);
  if(Object.keys(pending).length) schedulePendingDeleteSweep();
}

// Забираем задачи с других устройств этого же аккаунта. Вызывается при входе
// и при возврате в приложение (visibilitychange) — отдельного поллинг-таймера
// нет, этого достаточно для сценария "взял другой телефон".
function pullTasksFromServer(){
  if(!navigator.onLine||!isGoogleSignedIn()) return;
  fetch(WORKER_URL+'/tasks',{headers:{'Authorization':'Bearer '+getGoogleToken()}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(data){
      if(!data||!data.tasks) return;
      var synced=getSyncedTasks();
      var pendingNow=getPendingDeletes(), explicitNow=getExplicitDeletes();
      var changed=false;
      var hasReminder=false;
      data.tasks.forEach(function(rec){
        var local=findTaskBySyncId(rec.syncId);
        if(rec.deleted){
          if(local && rec.updatedAt>=(local.updatedAt||0)){
            removeTaskBySyncIdFromState(rec.syncId); delete synced[rec.syncId]; changed=true;
          } else if(!local && synced[rec.syncId]){
            delete synced[rec.syncId];
          }
          return;
        }
        if(local){
          if(rec.updatedAt>(local.updatedAt||0)){
            Object.assign(local,{text:rec.text,desc:rec.desc,priority:rec.priority,date:rec.date,
              reminderTime:rec.reminderTime,checklist:rec.checklist,done:rec.done,updatedAt:rec.updatedAt});
            synced[rec.syncId]={sig:taskSyncSig(local),updatedAt:rec.updatedAt};
            changed=true;
            if(rec.reminderTime) hasReminder=true;
          }
          /* иначе локальная копия новее/такая же — оставляем, уйдёт наверх на следующем синке */
        } else {
          // НЕ воскрешаем задачу, которую пользователь ЯВНО удалил на этом
          // устройстве: её надгробие уйдёт ближайшим синком, но сервер прямо
          // сейчас всё ещё присылает её как живую. Без этой проверки pull
          // создавал её заново, а следом срабатывало «задача вернулась» и
          // отменяло удаление НАВСЕГДА (жалоба Александра 2026-08-18:
          // «удаляю — не удаляется в других версиях, задачи потом снова
          // появляются»).
          // ВАЖНО: только явное удаление. Для НЕЯВНОЙ пропажи (pending)
          // воскрешение — это и есть спасение, ради которого выдержка
          // задумывалась: задача исчезла из-за гонки, сервер вернул её,
          // следующий синк отменит удаление. Запрещать здесь и pending —
          // значит вернуть исходный баг с пропажей задач.
          if(explicitNow[rec.syncId]!==undefined) return;
          var nt=T(rec.text,rec.priority,rec.done,rec.desc,rec.date,rec.reminderTime,rec.checklist,rec.syncId,rec.updatedAt);
          state.sections.month=state.sections.month.concat([nt]); // временно, rebalanceSections() ниже разложит верно
          synced[rec.syncId]={sig:taskSyncSig(nt),updatedAt:rec.updatedAt};
          changed=true;
          if(rec.reminderTime) hasReminder=true;
        }
      });
      if(changed){
        saveSyncedTasks(synced);
        rebalanceSections();
        saveStorage(); scheduleReminders(); syncRemindersToServer(); render();
        // Пуш-напоминание, пришедшее СИНКОМ с другого устройства, никогда не
        // просило разрешение на уведомления ЗДЕСЬ (ensureNotifPermission
        // вызывается только когда пользователь сам ставит напоминание на этом
        // устройстве) — без этого устройство могло вообще не быть подписано
        // на push, и напоминание, синканное с другого телефона, молча не
        // приходило (2026-07-24, найдено по жалобе: пуш пришёл только на одно
        // из двух синхронизированных устройств).
        if(hasReminder) ensureNotifPermission();
      }
    }).catch(function(){});
}

/* ── Notifications + Service Worker ── */
var FIRED_KEY = 'vtodo-fired';

// 2026-07-29: раньше при провале тут не оставалось НИ ОДНОГО видимого следа —
// нашли живьём на юзере в iPhone Safari (открыто вкладкой, не установлено на
// «Экран Домой»): там просто нет PushManager, и клик по кнопке молча ничего
// не делал — человек решил, что кнопка сломана. Плюс защита от старых
// браузеров, где requestPermission() — коллбэк, а не Promise (у него нет
// .then, вызов бы уронил всю функцию исключением ДО показа диалога).
function requestNotifPermission(){
  if(!('Notification' in window)||!('PushManager' in window)||!('serviceWorker' in navigator)){
    state.pushStatus='unsupported'; render(); return;
  }
  if(Notification.permission==='granted'){ subscribePush(); return; }
  if(Notification.permission==='default'){
    try{
      var maybePromise=Notification.requestPermission(function(legacyResult){
        if(legacyResult==='granted') subscribePush(); else { state.pushStatus='error'; render(); }
      });
      if(maybePromise&&typeof maybePromise.then==='function'){
        maybePromise.then(function(p){ if(p==='granted') subscribePush(); else { state.pushStatus='error'; render(); } })
          .catch(function(){ state.pushStatus='error'; render(); });
      }
    }catch(e){ state.pushStatus='error'; render(); }
  }
}

/* Вызывается когда задача имеет reminderTime — запрашивает разрешение автоматически */
function ensureNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='granted'){ subscribePush(); return; }
  if(Notification.permission==='default') requestNotifPermission();
}

function getFired(){ try{ return JSON.parse(localStorage.getItem(FIRED_KEY)||'{}'); }catch(e){ return {}; } }
function markFired(taskId, rt){ var f=getFired(); f[taskId+':'+rt]=Date.now(); try{ localStorage.setItem(FIRED_KEY,JSON.stringify(f)); }catch(e){} }

/* Проверка напоминаний — окно 24 часа, баннер всегда, системное если разрешено */
function checkReminders(){
  var now=Date.now(); var fired=getFired(); var due=[];
  // Чистим старые отметки сработавших напоминаний. Окно проверки ниже — 24ч,
  // так что всё старше недели уже не нужно. Без этого vtodo-fired копился бы
  // в localStorage вечно (по одному ключу на каждое сработавшее напоминание,
  // включая давно удалённые задачи) — аудит 2026-08-12. Пишем обратно только
  // если реально что-то удалили, чтобы не дёргать localStorage каждые 30с.
  var pruneCut=now-7*86400000, pruned=false;
  for(var fk in fired){ if(fired[fk]<pruneCut){ delete fired[fk]; pruned=true; } }
  if(pruned){ try{ localStorage.setItem(FIRED_KEY,JSON.stringify(fired)); }catch(e){} }
  allTasks().forEach(function(task){
    if(!task.reminderTime||!task.date||task.done) return;
    var key=task.id+':'+task.reminderTime;
    if(fired[key]) return;
    var ts=new Date(task.date+'T'+task.reminderTime).getTime();
    if(ts<=now && ts>now-86400000){ due.push(task); markFired(task.id,task.reminderTime); }
  });
  if(!due.length) return;
  /* Системное уведомление — только как ЗАПАСНОЙ вариант, если push неактивен
     или мы офлайн (иначе сервер уже пришлёт push → было бы два уведомления).
     wasPushOk() закрывает гонку холодного старта — см. комментарий выше. */
  if(Notification.permission==='granted' && !((pushActive||wasPushOk()) && navigator.onLine)){
    due.forEach(function(task){
      // Текст уведомления берём из переводов, а не хардкодом по-русски: всё
      // остальное в приложении переведено на 5 языков, и только уведомление
      // приходило русским (аудит 2026-08-17, п.№6).
      try{ new Notification(task.text,{body:L.notif_reminder+' · '+dateLabel(task.date)+' '+task.reminderTime,icon:'icon.png',tag:task.id}); }catch(e){}
    });
  }
  /* Баннер внутри приложения — всегда */
  state.dueReminders=due; render();
}

setInterval(checkReminders, 30000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ rebalanceSections(); saveStorage(); render(); checkReminders(); scheduleReminders(); syncRemindersToServer(); pullTasksFromServer();
  // Общие группы тоже — раньше при возврате в приложение обновлялись только
  // ЛИЧНЫЕ задачи, и правки напарника в общем списке было не видно, пока не
  // выйдешь из группы и не зайдёшь заново (аудит 2026-08-17, п.№3).
  // Список групп тоже — точка на вкладке должна появляться САМА, не дожидаясь
  // захода в раздел. Это одно чтение на возврат в приложение.
  if(isGoogleSignedIn()) fetchMyGroups();
  groupPollTick();
} });

/* Передаём напоминания в SW для фонового режима */
function scheduleReminders(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(function(reg){
    if(!reg.active) return;
    var list=allTasks()
      .filter(function(t){ return t.reminderTime&&t.date&&!t.done; })
      .map(function(t){
        var dt=new Date(t.date+'T'+t.reminderTime);
        var d=new Date(t.date); var ds=d.getDate()+' '+L.months_short[d.getMonth()];
        return {id:t.id,text:t.text,sub:L.notif_reminder+' • '+ds,ts:dt.getTime()};
      })
      .filter(function(r){ return r.ts>Date.now(); });
    reg.active.postMessage({type:'SCHEDULE',list:list});
  });
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    swReg=reg;
    navigator.serviceWorker.ready.then(function(r){ swReg=r; scheduleReminders(); });
  }).catch(function(){});
}

/* ── Init ── */
loadStorage();
rebalanceSections();
applyLang(state.lang, true);
state.summary=L.summary_default;
render();
subscribePush();
checkReminders();
refreshAiLimit();
// Холодный старт уже залогиненного юзера — visibilitychange тут НЕ сработает
// (переход "стало видимо" не происходит на самой первой загрузке страницы),
// а без этого вызова синк задач ждал бы либо нового входа, либо следующего
// сворачивания/разворачивания приложения. pullTasksFromServer() сам
// проверяет isGoogleSignedIn(), безопасно звать безусловно (2026-07-24).
pullTasksFromServer();
// ...и отправить СВОИ изменения тоже. Раньше при холодном старте шёл только
// pull: отложенное удаление (см. PENDING_DELETE_GRACE_MS), записанное в прошлый
// запуск, так и лежало непереданным, пока пользователь не свернёт-развернёт
// приложение. Теперь выдержка к этому моменту давно истекла и надгробие уходит
// сразу (2026-08-18). Сам doSyncTasksToServer() проверяет сеть и вход.
doSyncTasksToServer();
