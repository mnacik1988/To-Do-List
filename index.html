function syncEdit(){ if(state.modalMode!=='edit'||!state.edit) return; var t=document.getElementById('edit-text'),d=document.getElementById('edit-desc'),dt=document.getElementById('edit-date'),dr=document.getElementById('edit-reminder'); if(t) state.edit.text=t.value; if(d) state.edit.desc=d.value; if(dt) state.edit.date=dt.value; if(dr) state.edit.reminderTime=dr.value; }
function syncDsInput(){ var el=document.getElementById('ds-input'); if(el) state.dsAddText=el.value; }

function toggleTheme(){ state.theme=state.theme==='light'?'dark':'light'; render(); }
function setTab(tab){ state.tab=tab; render(); }
function toggleDone(section,id){ state.sections[section]=state.sections[section].map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t;}); scheduleReminders(); syncRemindersToServer(); render(); }
/* Отметка пункта чек-листа — если после этого отмечены ВСЕ пункты, задача целиком автоматически становится выполненной (и наоборот, снимается, если снять галочку с любого пункта). */
function toggleChecklistItem(section,taskId,itemId){
  state.sections[section]=state.sections[section].map(function(t){
    if(t.id!==taskId||!t.checklist||!t.checklist.length) return t;
    var checklist=t.checklist.map(function(i){return i.id===itemId?Object.assign({},i,{done:!i.done}):i;});
    var allDone=checklist.every(function(i){return i.done;});
    return Object.assign({},t,{checklist:checklist,done:allDone});
  });
  render();
}
function checklistDelItem(itemId){
  if(!state.edit) return;
  var task=currentTask();
  var list=state.edit.checklist!=null?state.edit.checklist:(task?(task.checklist||[]):[]);
  state.edit.checklist=list.filter(function(i){return i.id!==itemId;});
  render();
}
function checklistAddItem(){
  if(!state.edit) return;
  var el=document.getElementById('checklist-new-item'); if(!el) return;
  var text=el.value.trim(); if(!text) return;
  var task=currentTask();
  var list=state.edit.checklist!=null?state.edit.checklist:(task?(task.checklist||[]):[]);
  state.edit.checklist=list.concat([checklistItem(text)]);
  render();
  var ni=document.getElementById('checklist-new-item'); if(ni) ni.focus();
}
// Разбить название задачи (например, вставленный список покупок из чата)
// на чек-лист через ИИ — просили сделать именно умным разбором, а не
// простым split по запятой, чтобы составные названия ("рисовый уксус") не
// рвались на части (2026-07-17).
// Разбивка на чек-лист. Источник — ОПИСАНИЕ, если оно заполнено, иначе
// название (как было раньше).
// Почему описание: человеку приходит длинное сообщение в мессенджере, он его
// копирует и хочет разложить на пункты. В поле добавления пункта чек-листа
// maxlength=40 — такой текст туда физически не вставить, а в название влезет
// только 120 символов. Описание держит 500 (столько же клампит и сервер,
// см. LEN_DESC в воркере — врозь поднимать нельзя, текст молча обрежется
// при синхронизации). Замечание Александра 2026-08-19.
// Работает в ДВУХ местах: карточка редактирования и форма «Новая задача».
// Разница только в том, откуда читать текст и куда класть результат —
// сам разбор, промпт, лимиты и локальный запасной путь общие.
function aiSplitChecklist(){
  var inQa=!!state.quickAdd;
  if(!inQa && !state.edit) return;
  if(!inQa) syncEdit();   // в форме создания поля пишут в state сами, по input
  var curTitle=(inQa?state.qaText:state.edit.text)||'';
  var curDesc =(inQa?state.qaDesc:state.edit.desc)||'';
  var fromDesc=!!curDesc.trim();
  var text=(fromDesc?curDesc:curTitle).trim();
  if(!text) return;
  // Имя от модели принимаем, только если разбирали САМО название. Иначе
  // затёрли бы то, что человек уже написал руками.
  var applyName=function(name){
    if(!name) return;
    if(fromDesc && curTitle.trim()) return;
    if(inQa) state.qaText=clampLen(name,LEN_TITLE);
    else state.edit.text=clampLen(name,LEN_TITLE);
  };
  var setItems=function(list){
    var made=list.map(function(t){ return checklistItem(t); }).filter(function(it){ return !!it.text; });
    if(inQa) state.qaChecklist=made; else state.edit.checklist=made;
  };
  // Без ИИ тоже должно работать — та же логика, что в v1.50 для микрофона
  // чек-листа: недоступность ИИ не повод терять уже введённый текст.
  var fallback=function(note){
    state.aiSplitting=false;
    var items=localSplitChecklistItems(text);
    if(items.length>1){
      setItems(items);
      // ИИ придумывает название сам, локальный разбор — нет. В форме создания
      // пустое название = кнопка «Добавить задачу» молча ничего не делает
      // (qa-save выходит на пустом тексте). Подставляем родовое.
      if(!curTitle.trim()) applyName(L.voice_list_title);
    } else if(note){
      state.aiAnswer=note; anim.summary=true;
    }
    render();
  };
  if(!state.aiParseOn||!navigator.onLine){ fallback(''); return; }
  if(!isGoogleSignedIn()){
    handleAuthFailure(function(){ aiSplitChecklist(); }, function(){ fallback(L.ai_need_auth); });
    return;
  }
  if(!canUseAi()){ fallback(L.ai_limit); return; }
  state.aiSplitting=true; render();
  var prompt=
    'Split this text into a short generic task name and a checklist of separate items, in the SAME language as the text.' + '\n'+
    'Text: "'+text+'"' + '\n'+
    'Keep each item as a natural phrase — do NOT split compound descriptive phrases apart (e.g. "рисовый уксус" stays ONE item, not two).' + '\n'+
    'Greetings, names and polite filler are never checklist items.' + '\n'+
    'Return ONLY JSON: {"name":"short generic task name","items":["item1","item2"]}';
  callAi(prompt,function(err,data){
    state.aiSplitting=false;
    if(err||!data||!data.items||!data.items.length){
      fallback((err&&err.limit)?L.ai_limit:((err&&err.needAuth)?L.ai_need_auth:L.ai_offline));
      return;
    }
    setItems(data.items);
    applyName(data.name);
    render();
  });
}
// Голосом добавить один или несколько пунктов в чек-лист (не трогая
// название задачи) — та же анти-дубликатная логика распознавания речи,
// что и в onAiMic (растущие финалы на Android заменяют накопленный текст,
// а не складываются), результат разбивается на пункты через ИИ по тем же
// правилам, что и aiSplitChecklist (составные фразы не рвутся) (2026-07-21).
function onChecklistMic(){
  if(state.clProc) return;
  if(!state.clRec){
    if(!SpeechRec || (!state.edit && !state.modal)) return;
    state.micDenied=false; clTranscript='';
    var clFinalAcc='', clLastFinalSeg='';
    var rec=new SpeechRec();
    rec.lang=LANG_BCP[voiceLangCode()]||'ru-RU'; rec.continuous=true; rec.interimResults=true;
    rec.onresult=function(e){
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal){
          var norm=t.trim();
          if(norm){
            var accLow=clFinalAcc.trim().toLowerCase(), normLow=norm.toLowerCase();
            if(normLow!==clLastFinalSeg){
              if(!accLow || normLow.indexOf(accLow)===0) clFinalAcc=norm;
              else clFinalAcc=(clFinalAcc.trim()+' '+norm).trim();
              clLastFinalSeg=normLow;
            }
          }
        } else interim=t;
      }
      var full=(clFinalAcc||interim).trim();
      if(full) clTranscript=full;
    };
    rec.onerror=function(ev){
      if(ev.error==='no-speech'||ev.error==='aborted') return;
      state.clRec=false; state.clProc=false; clRecObj=null;
      if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ state.micDenied=true; state.aiNote='⚠️ '+L.mic_denied; anim.aiNote=true; }
      render();
    };
    rec.onend=function(){
      if(state.clRec){ try{ rec.start(); }catch(e){ state.clRec=false; state.clProc=true; clRecObj=null; render(); var clToProcess=clTranscript; clTranscript=''; voiceAddChecklistItems(clToProcess); } }
    };
    rec.start(); clRecObj=rec;
    state.clRec=true; render();
  } else {
    state.clRec=false; state.clProc=true;
    if(clRecObj){ clRecObj.stop(); clRecObj=null; }
    render();
    if(clTranscript){ var clStopText=clTranscript; clTranscript=''; voiceAddChecklistItems(clStopText); }
    else { state.clProc=false; render(); }
  }
}
// Разбор надиктованного чек-листа БЕЗ ИИ. Нужен как запасной путь: до этого
// микрофон чек-листа работал только через ИИ, и при выключенном ИИ-разборе,
// исчерпанном лимите или без сети надиктованное просто ВЫБРАСЫВАЛОСЬ с
// сообщением об ошибке (просьба Александра 2026-08-19).
// Делим по запятым и союзам — так составные названия остаются целыми
// («рисовый уксус» не разваливается на два пункта, ради чего в ИИ-промпте
// стоит отдельная оговорка).
// ⚠️ Предел честно известен: распознавание речи далеко не всегда ставит
// запятые. Сказанное на одном дыхании «купить молоко хлеб сыр» придёт одной
// строкой без разделителей и станет ОДНИМ пунктом. Это всё равно лучше, чем
// потерять фразу целиком: пункт можно поправить руками.
// drop — «вежливость»: приветствия, благодарности, обращения. Отдельная
// проблема, найденная живьём (21.08): в надиктованном сообщении вступление и
// концовка часто КОРОТКИЕ («Привет дорогой», «Спасибо») и по длине ничем не
// отличаются от нормального пункта, поэтому фильтр CL_MAX_WORDS их пропускал,
// и они попадали в чек-лист наравне с продуктами. ИИ-разбор такое отбрасывает
// сам, локальному нужен явный список.
var CL_LOCAL={
  ru:{conj:['и','да'],       lead:['купить','купи','добавь','добавить','нужно','надо','взять'],
      drop:['привет','приветик','здравствуй','здравствуйте','добрый','доброе','доброй','утро','утра','день','дня','вечер','вечера','ночи','спасибо','пожалуйста','благодарю','дорогой','дорогая','дорогие','милый','милая','любимый','любимая','целую','люблю','пока','ок','хорошо','слушай','слышишь']},
  en:{conj:['and'],          lead:['buy','add','get','need'],
      drop:['hi','hello','hey','good','morning','afternoon','evening','thanks','thank','you','please','dear','love','honey','bye','ok','okay']},
  uk:{conj:['і','та','й'],   lead:['купити','купи','додай','додати','треба','потрібно'],
      drop:['привіт','вітаю','добрий','доброго','доброї','ранку','день','вечір','дякую','будь','ласка','дорогий','дорога','люблю','цілую','бувай','добре','гаразд']},
  de:{conj:['und'],          lead:['kaufen','hinzufügen','besorgen'],
      drop:['hallo','hi','guten','morgen','tag','abend','danke','bitte','liebe','lieber','schatz','tschüss','ok']},
  fr:{conj:['et'],           lead:['acheter','ajouter'],
      drop:['salut','bonjour','bonsoir','merci','plaît','plait','cher','chère','chéri','chérie','bisous','revoir','ok','coucou']}
};
// Максимум слов в пункте списка. Всё длиннее — это проза («Купи пожалуйста
// домой на вечер продукты»), а не позиция, и в чек-лист ей не место.
var CL_MAX_WORDS=4;
// Узкий список ИМЕННО покупочных глаголов — признак «это перечисление, а не
// одно дело». Держим отдельно от CL_LOCAL.lead: там глаголы широкие
// («надо», «взять», «добавь»), и по ним признак сработал бы на обычных делах.
var CL_BUY={ru:['купить','купи','куплю'],en:['buy'],uk:['купити','купи'],de:['kaufen','besorgen'],fr:['acheter']};
function hasBuyVerb(text){
  var low=String(text==null?'':text).toLowerCase();
  var list=CL_BUY[voiceLangCode()]||CL_BUY.ru;
  for(var i=0;i<list.length;i++) if(low.indexOf(list[i]+' ')>=0) return true;
  return false;
}
// Служебные слова голосовой КОМАНДЫ. Нужны только в режиме listOnly (микрофон
// внутри чек-листа): там человек не диктует список молча, он отдаёт приказ —
// «Добавь ещё в чек-лист макароны, гречку и молоко». Раньше приказ съедал
// первый товар: снимался ровно один глагол («добавь»), а «ещё в чек-лист»
// оставалось приклеенным к «макароны гречку», кусок вырастал за CL_MAX_WORDS
// и молча выбрасывался как проза — в списке оставалось одно «молоко»
// (найдено живьём 21.08).
var CL_CMD={
  ru:['ещё','еще','в','во','на','к','ко','мне','себе','туда','сюда','чек-лист','чеклист','чек','лист','список','списка','пункт','пункты','также','тоже','так','же','ну','вот'],
  en:['to','the','my','into','checklist','check','list','item','items','also','more'],
  uk:['ще','в','у','на','до','мені','собі','чек-лист','чеклист','чек','лист','список','також','теж'],
  de:['noch','in','die','der','zur','zum','checkliste','liste','auch','mir'],
  fr:['encore','dans','la','le','au','checklist','liste','aussi','moi']
};
// Снимаем ВЕСЬ приказ целиком, а не один глагол: идём по словам с начала,
// пока они служебные, и останавливаемся на первом содержательном.
function stripCommandPrefix(text,cfg){
  var raw=String(text==null?'':text).trim();
  var cmd=CL_CMD[voiceLangCode()]||CL_CMD.ru;
  var words=raw.split(/ +/), i=0;
  while(i<words.length){
    var w=words[i].toLowerCase().replace(/[^0-9a-zа-яёіїєґäöüßàâçèéêîôùû'-]/g,'');
    if(w && cmd.indexOf(w)<0 && cfg.lead.indexOf(w)<0 && (cfg.drop||[]).indexOf(w)<0) break;
    i++;
  }
  // Если служебным оказалось всё до единого слова — значит мы ошиблись
  // в разметке, а не человек. Возвращаем исходное, терять текст нельзя.
  var rest=words.slice(i).join(' ').replace(/^[\s,;.:—–-]+/,'').trim();
  return rest||raw;
}
// listOnly — «здесь весь текст и есть список» (микрофон чек-листа). В этом
// режиме нет прозы, которую надо отсеивать, поэтому фильтр CL_MAX_WORDS
// выключается: лучше некрасивый пункт «макароны гречку» (человек не сделал
// паузы, распознавание не поставило запятую), чем молча потерянный продукт.
function localSplitChecklistItems(text,listOnly){
  var t=String(text==null?'':text).trim();
  if(!t) return [];
  var cfg=CL_LOCAL[voiceLangCode()]||CL_LOCAL.ru;
  if(listOnly) t=stripCommandPrefix(t,cfg);
  // Делим и по точкам тоже, не только по запятым: надиктованное сообщение
  // обычно содержит вступление отдельными предложениями («Виталя. Купи...»),
  // и без этого всё вступление слипалось с первой позицией списка.
  var re=new RegExp('[,;.!?]| +(?:'+cfg.conj.join('|')+') +','i');
  var out=[];
  t.split(re).forEach(function(part){
    var s=String(part==null?'':part).replace(/^[-–—• ]+/,'').trim();
    if(!s) return;
    // Если в куске есть глагол-приказ, берём то, что ПОСЛЕ него:
    // «в копеечке купи салфетки» → «салфетки». Иначе вся привязка к месту
    // уехала бы в пункт и была отброшена как проза вместе с товаром.
    var low=s.toLowerCase();
    for(var k=0;k<cfg.lead.length;k++){
      var at=low.indexOf(cfg.lead[k]+' ');
      if(at>=0){ s=s.slice(at+cfg.lead[k].length+1).trim(); break; }
    }
    if(!s) return;
    var words=s.split(/ +/);
    // Кусок выбрасываем, только если в нём НЕТ ни одного содержательного
    // слова. Одного «спасибо» рядом с товаром мало, чтобы потерять товар.
    var allFiller=true;
    for(var w=0;w<words.length;w++){
      var cw=words[w].toLowerCase().replace(/[^0-9a-zа-яёіїєґäöüßàâçèéêîôùû']/g,'');
      if(cw && (cfg.drop||[]).indexOf(cw)<0){ allFiller=false; break; }
    }
    if(allFiller) return;
    if(!listOnly && words.length>CL_MAX_WORDS) return;   // проза, а не пункт
    out.push(clampLen(s,LEN_CHECKLIST_ITEM));
  });
  return out;
}
// Общая точка добавления пунктов — и для ИИ, и для локального разбора.
function putChecklistItems(items){
  if(!items||!items.length){ render(); return; }
  // После срезания маркеров кусок может схлопнуться в пустоту («—», «.»).
  // Пустая строка с чекбоксом хуже, чем её отсутствие.
  var made=items.map(function(t){ return checklistItem(t); }).filter(function(it){ return !!it.text; });
  if(!made.length){ render(); return; }
  if(state.edit){
    var task=currentTask();
    var list=state.edit.checklist!=null?state.edit.checklist:(task?(task.checklist||[]):[]);
    state.edit.checklist=list.concat(made);
    render();
  } else {
    // Режим просмотра задачи (без редактирования): дописываем прямо в задачу
    // в state.sections и сохраняем — render() в конце вызывает saveStorage.
    appendChecklistToTask(made);
  }
}

function voiceAddChecklistItems(transcript){
  state.clProc=false;
  if(!transcript || (!state.edit && !state.modal)){ render(); return; }
  // Локальный разбор — когда ИИ недоступен или сознательно выключен.
  // Раньше в этих случаях надиктованное просто пропадало.
  var fallback=function(note){
    // listOnly: это микрофон ВНУТРИ чек-листа, всё сказанное — список.
    var items=localSplitChecklistItems(transcript,true);
    if(!items.length){ if(note){ state.aiAnswer=note; anim.summary=true; } render(); return; }
    putChecklistItems(items);
  };
  if(!state.aiParseOn||!navigator.onLine){ fallback(''); return; }
  if(!isGoogleSignedIn()){
    handleAuthFailure(function(){ voiceAddChecklistItems(transcript); }, function(){
      fallback(L.ai_need_auth);
    });
    return;
  }
  if(!canUseAi()){ fallback(L.ai_limit); return; }
  state.clProc=true; render();
  var prompt=
    'Split this spoken text into separate checklist items, in the SAME language as the text.' + String.fromCharCode(10)+
    'Text: "'+transcript+'"' + String.fromCharCode(10)+
    'Keep each item as a natural phrase — do NOT split compound descriptive phrases apart (e.g. "рисовый уксус" stays ONE item, not two).' + String.fromCharCode(10)+
    'Return ONLY JSON: {"items":["item1","item2"]}';
  callAi(prompt,function(err,data){
    state.clProc=false;
    if(err||!data||!data.items||!data.items.length){
      // ИИ не смог — разбираем сами, а не теряем сказанное.
      fallback((err&&err.limit)?L.ai_limit:((err&&err.needAuth)?L.ai_need_auth:L.ai_offline));
      return;
    }
    putChecklistItems(data.items);
  });
}
function appendChecklistToTask(items){
  if(!state.modal){ render(); return; }
  var sec=state.modal.section, taskId=state.modal.id;
  state.sections[sec]=(state.sections[sec]||[]).map(function(t){
    if(t.id!==taskId) return t;
    var list=(t.checklist||[]).concat(items);
    // добавили невыполненные пункты → задача уже не "полностью выполнена"
    var allDone=list.length>0 && list.every(function(i){return i.done;});
    return Object.assign({},t,{checklist:list,done:allDone});
  });
  render();
}
function cyclePri(section,id){ state.sections[section]=state.sections[section].map(function(t){ if(t.id!==id) return t; return Object.assign({},t,{priority:PRI_ORDER[(PRI_ORDER.indexOf(t.priority)+1)%3]}); }); render(); }

function openModal(section,id){ state.fabOpen=false; state.modal={section:section,id:id}; state.modalMode='view'; state.edit=null; state.aiRec=false; state.aiProc=false; state.aiNote=''; state.confirmDelete=false; anim.modal=true; render(); }
// Есть ли несохранённые правки. Сравниваем форму с самой задачей, а не
// «трогали ли поля» — человек мог поменять и вернуть обратно, это не правка.
function editHasChanges(){
  if(state.modalMode!=='edit'||!state.edit) return false;
  syncEdit();
  var t=currentTask(); if(!t) return false;
  var e=state.edit;
  if((e.text||'')!==(t.text||'')) return true;
  if((e.desc||'')!==(t.desc||'')) return true;
  if((e.priority||'')!==(t.priority||'')) return true;
  if((e.date||'')!==(t.date||'')) return true;
  if((e.reminderTime||'')!==(t.reminderTime||'')) return true;
  var sig=function(list){ return (list||[]).map(function(i){ return i.text+':'+(i.done?1:0); }).join('|'); };
  return sig(e.checklist)!==sig(t.checklist);
}
function doCloseModal(){
  if(aiTimeout){clearTimeout(aiTimeout);aiTimeout=null;}
  if(modalRecObj){modalRecObj.stop();modalRecObj=null;}
  state.aiRec=false; // запись глушим сразу, остальное — после анимации уезда
  closeSheetAnimated('modal', function(){
    state.modal=null; state.modalMode='view'; state.edit=null;
    state.aiProc=false; state.aiNote=''; state.confirmDelete=false; render();
  });
}
// Кнопка «Сохранить» лежит внизу формы и на телефоне часто вне экрана —
// человек закрывает крестиком или свайпом и молча теряет всё, что ввёл
// (замечание Александра 2026-08-20). Спрашиваем, а не гадаем.
function closeModal(){
  if(editHasChanges()){
    askChoice(L.edit_unsaved,
      L.btn_save, function(){ saveEdit(); if(state.modal) doCloseModal(); else render(); },
      L.btn_discard, doCloseModal);
    return;
  }
  doCloseModal();
}
function startEdit(){ var task=currentTask(); if(!task) return; syncEdit(); state.modalMode='edit'; state.edit={text:task.text,desc:task.desc||'',priority:task.priority,date:task.date||'',reminderTime:task.reminderTime||'',checklist:(task.checklist||[]).map(function(i){return Object.assign({},i);})}; state.aiNote=''; render(); /* НЕ фокусируем поле имени автоматически — иначе на телефоне сразу выскакивает клавиатура. Пользователь сам тапнет по нужному полю (просьба Александра 2026-07-23). */ }
function cancelEdit(){ syncEdit(); state.modalMode='view'; state.edit=null; render(); }
function saveEdit(){
  syncEdit(); var m=state.modal,e=state.edit;
  if(m&&e){
    var text=(e.text||'').trim()||L.untitled;
    var newSec=dateToSection(e.date);
    var editedChecklist=e.checklist||[];
    var prevChecklist=(currentTask()||{}).checklist||[];
    var patch={text:text,desc:e.desc,priority:e.priority,date:e.date,reminderTime:e.reminderTime||'',checklist:editedChecklist};
    // Состав чек-листа мог поменяться (добавили/убрали пункт) — если он не
    // пуст, done задачи всегда пересчитывается от факта "все пункты отмечены",
    // а не остаётся со старого значения (иначе задача может застрять
    // "выполненной" после добавления нового неотмеченного пункта).
    if(editedChecklist.length) patch.done=editedChecklist.every(function(i){return i.done;});
    // Удалили ВСЕ пункты — раньше пересчёт сюда не доходил (стоял под
    // условием выше), и задача оставалась зачёркнутой, хотя того, на чём
    // держалось «выполнено», больше нет (аудит 2026-08-17). Сбрасываем только
    // если чек-лист БЫЛ: у задачи, где его отродясь не было, done ставится
    // руками галочкой и трогать его тут нельзя.
    else if(prevChecklist.length) patch.done=false;
    if(newSec!==m.section){
      var updated=null;
      state.sections[m.section]=state.sections[m.section].filter(function(t){if(t.id===m.id){updated=Object.assign({},t,patch);return false;}return true;});
      if(updated) state.sections[newSec]=[updated].concat(state.sections[newSec]);
      state.modal=null;
    } else {
      state.sections[m.section]=state.sections[m.section].map(function(t){return t.id===m.id?Object.assign({},t,patch):t;});
    }
  }
  state.modalMode='view'; state.edit=null; render(); scheduleReminders(); syncRemindersToServer();
  if(e && e.reminderTime) ensureNotifPermission();
}
function setPri(pri){ syncEdit(); if(state.edit) state.edit.priority=pri; render(); }
function toggleDoneModal(){ var m=state.modal; if(m) toggleDone(m.section,m.id); else render(); }
function deleteTask(){ state.confirmDelete=true; render(); }
function confirmDeleteYes(){ var m=state.modal; if(!m){state.confirmDelete=false;render();return;} markExplicitDelete(function(t){ return t.id===m.id; }); state.sections[m.section]=state.sections[m.section].filter(function(t){return t.id!==m.id;}); state.confirmDelete=false; scheduleReminders(); syncRemindersToServer(); closeModal(); }
function confirmDeleteNo(){ state.confirmDelete=false; render(); }

/* ── Select mode ── */
function enterSelectMode(){ state.selectMode=true; state.selected={}; render(); }
function exitSelectMode(){ state.selectMode=false; state.selected={}; render(); }
function toggleSelectTask(id,section){
  var s=Object.assign({},state.selected);
  if(s[id]) delete s[id]; else s[id]=section;
  state.selected=s; render();
}
function bulkDelete(){
  var ids=Object.keys(state.selected);
  if(!ids.length) return;
  markExplicitDelete(function(t){ return !!state.selected[t.id]; });
  for(var sec in state.sections){
    state.sections[sec]=state.sections[sec].filter(function(t){ return !state.selected[t.id]; });
  }
  state.selected={}; state.selectMode=false; scheduleReminders(); syncRemindersToServer(); render();
}
function deleteTaskById(sec,id){
  markExplicitDelete(function(t){ return t.id===id; });
  if(sec&&state.sections[sec]){
    state.sections[sec]=state.sections[sec].filter(function(t){ return t.id!==id; });
  } else {
    for(var s in state.sections){ state.sections[s]=state.sections[s].filter(function(t){ return t.id!==id; }); }
  }
  scheduleReminders(); syncRemindersToServer(); render();
}

/* ── Overdue actions ── */
function overdueToggle(){ state.overdueOpen=!state.overdueOpen; state.overdueSelecting=false; state.overdueSelected={}; render(); }
function overdueStartSel(){ state.overdueSelecting=true; state.overdueSelected={}; render(); }
function overdueCancelSel(){ state.overdueSelecting=false; state.overdueSelected={}; render(); }
function overdueSelTask(id){ var s=Object.assign({},state.overdueSelected); if(s[id]) delete s[id]; else s[id]=true; state.overdueSelected=s; render(); }
function overdueReschedule(){
  var today=todayStr();
  var ids=state.overdueSelected;
  for(var sec in state.sections){
    state.sections[sec]=state.sections[sec].map(function(t){
      if(ids[t.id]) return Object.assign({},t,{date:today});
      return t;
    });
  }
  rebalanceSections();
  state.overdueSelecting=false; state.overdueSelected={};
  render(); scheduleReminders(); syncRemindersToServer();
}
function overdueDelete(){
  var ids=state.overdueSelected;
  markExplicitDelete(function(t){ return !!ids[t.id]; });
  for(var sec in state.sections){
    state.sections[sec]=state.sections[sec].filter(function(t){ return !ids[t.id]; });
  }
  state.overdueSelecting=false; state.overdueSelected={};
  render(); scheduleReminders(); syncRemindersToServer();
}

/* ── FAB + voice ── */
function onFabMic(){
  if(state.processing) return;
  if(state.voiceReply) unlockTts();
  state.fabOpen=false;
  if(!state.recording){
    state.recording=true; state.timer=0;
    timerIv=setInterval(function(){ state.timer++; var el=document.querySelector('.fab-timer'); if(el) el.textContent=fmtT(state.timer); },1000);
    if(SpeechRec){
      recTranscript='';
      var finalAcc='';
      var lastFinalSeg='';
      var rec=new SpeechRec();
      rec.lang=LANG_BCP[voiceLangCode()]||'ru-RU'; rec.continuous=true; rec.interimResults=true;
      // Фикс дублирования на Android (найдено диагностикой 2026-07-13 по
      // сырому логу с телефона Александра): движок на этом устройстве шлёт
      // КАЖДЫЙ финальный результат как ВСЮ фразу-с-начала целиком, повторно
      // "финализируя" её по мере роста ("завтра" -> "завтра в" -> "завтра в
      // 11:00" -> ...) — не отдельные новые кусочки. Складывать их (как было
      // раньше) — ошибка, отсюда дублирование. Правильно — ЗАМЕНЯТЬ
      // накопленный текст последним (самым полным) финалом, если он
      // продолжает предыдущий; если новый final НЕ является продолжением
      // (самостоятельный следующий отрезок речи после паузы) — дописываем
      // через пробел. Подтверждено рабочим тестом на реальном устройстве.
      rec.onresult=function(e){
        var interim='';
        for(var i=e.resultIndex;i<e.results.length;i++){
          var t=e.results[i][0].transcript;
          if(e.results[i].isFinal){
            var norm=t.trim();
            if(norm){
              var accLow=finalAcc.trim().toLowerCase(), normLow=norm.toLowerCase();
              if(normLow!==lastFinalSeg){
                if(!accLow || normLow.indexOf(accLow)===0) finalAcc=norm;
                else finalAcc=(finalAcc.trim()+' '+norm).trim();
                lastFinalSeg=normLow;
              }
            }
          } else interim=t;
        }
        recTranscript=(finalAcc||interim).trim();
        var el=document.querySelector('.fab-timer,.fab-transcript');
        if(el){ el.className='fab-transcript'; el.textContent=recTranscript; }
      };
      rec.onerror=function(e){
        if(e.error==='no-speech'||e.error==='aborted') return;
        if(e.error==='not-allowed'||e.error==='service-not-allowed') state.micDenied=true;
        clearInterval(timerIv); timerIv=null; state.recording=false; recObj=null; render();
      };
      // Чистим recTranscript ДО вызова processTranscript (а не после) — на
      // некоторых Android-движках 'onend' иногда срабатывает ДВАЖДЫ за один
      // цикл остановки записи (та же природа квирков, что и растущие финалы
      // в комментарии выше). Раньше recTranscript не очищался вообще —
      // повторное срабатывание onend находило тот же старый текст и создавало
      // ВТОРУЮ, идентичную задачу (баг с телефона Александра, две «Устранить
      // течь», 2026-08-14). Локальная копия — на случай, если сам
      // processTranscript асинхронно читает recTranscript ещё раз.
      rec.onend=function(){ if(state.recording){ try{ rec.start(); }catch(e){ clearInterval(timerIv); timerIv=null; state.recording=false; recObj=null; render(); } } else { recObj=null; if(recTranscript){ var toProcess=recTranscript; recTranscript=''; state.processing=true; render(); processTranscript(toProcess); } else render(); } };
      state.micDenied=false;
      rec.start(); recObj=rec;
    }
    render();
  } else {
    clearInterval(timerIv); timerIv=null;
    if(recObj){ state.recording=false; recObj.stop(); }
    else{ state.recording=false; state.processing=true; render(); setTimeout(function(){ addTasksBatch([{text:'Тестовая задача',priority:'mid',date:todayStr()}]); },1200); }
  }
}

// Общий разбор голоса локальным (не-ИИ) парсером — используется и при
// сбое/отсутствии ИИ, и при ручном выключателе (см. ниже).
// Порог, после которого сказанное считаем «длинным сообщением», а не короткой
// задачей: только тогда есть смысл и в чек-листе, и в сохранении оригинала.
var VOICE_LONG_CHARS=60;
function addTaskLocallyFromVoice(transcript, dayDate, undated){
  var localDate=dayDate||localParseDate(transcript, undated?'':undefined);
  var localText=localCleanText(transcript)||transcript;
  var localTime=localParseTime(transcript);
  if(dayDate) state.dsShowAdd=false;
  // Длинное сообщение (пример Александра: жена прислала список покупок
  // сплошным текстом) раньше целиком уезжало в НАЗВАНИЕ задачи и обрезалось
  // на 120 символах — остальное пропадало. Теперь пробуем разложить его на
  // чек-лист, а сам оригинал кладём в описание.
  var items=[], desc='';
  // Длина — не единственный признак списка. Живьём 21.08: «На вечер надо
  // купить хлеб сметану и рисовый уксус» — 48 символов, до порога не дотянуло,
  // и вся фраза уехала в название вместо чек-листа. Поэтому второй, независимый
  // признак: явный глагол ПОКУПКИ. Именно покупки, а не любой глагол из
  // CL_LOCAL.lead — «надо позвонить маме и папе» тоже разложилось бы на
  // «маме»/«папе» и превратилось бы в «Список», чего никто не просил.
  var raw=String(transcript||'');
  if(raw.length>VOICE_LONG_CHARS || hasBuyVerb(raw)){
    var split=localSplitChecklistItems(transcript);
    // Один пункт — значит разделителей не нашлось и разбивать было нечего.
    if(split.length>1){ items=split; desc=raw; }
  }
  // Название: если получился список — короткое родовое, иначе как раньше.
  var title=items.length?L.voice_list_title:localText;
  addTasksBatch([{text:title,priority:'mid',date:localDate,reminderTime:localTime,checklist:items,desc:desc}], undated);
}
function processTranscript(transcript){
  var dayDate=state.daySheet?state.daySheet.date:null;
  var today=todayStr();
  // Запоминаем раздел СЕЙЧАС, а не в колбэке ИИ: пока летит запрос, юзер
  // может уйти в другую вкладку, а задача должна попасть туда, где он её
  // наговорил. Раздел «Задачи» = дела без срока (см. dateToSection).
  var undated=state.view==='undated';
  // Ручной выключатель ИИ-разбора голоса (настройки → переключатель) —
  // пользователь сам решил не тратить дневной лимит на эту задачу, разбираем
  // локально сразу, без обращения к серверу вообще.
  if(!state.aiParseOn){
    state.processing=false;
    addTaskLocallyFromVoice(transcript, dayDate, undated);
    render();
    return;
  }
  // Выполненные задачи НЕ даём модели как кандидатов для правки — иначе
  // новая задача про того же человека/место ("Набрать Виталика") ошибочно
  // сопоставляется с уже сделанной похожей ("Сходить к Виталику") и вместо
  // ADD прилетает EDIT в пустоту (баг с телефона Александра, 2026-07-14).
  var existingTasks=allTasks().filter(function(t){return !t.done;}).map(function(t){return {text:t.text,date:t.date||''};});
  var prompt=
    'Today is '+today+'. Voice message: "'+transcript+'".\n'+
    'User tasks (NOT completed; completed tasks are excluded on purpose — never treat this voice message as editing something that is not in this list): '+JSON.stringify(existingTasks)+'.\n\n'+
    'IMPORTANT: Respond in the same language as the voice message.\n\n'+
    'Decide what the user wants:\n\n'+
    '1. ADD new tasks — user dictates new task(s) to create.\n'+
    'If the user names a place to go (store, pharmacy, etc.) followed by a list of specific items/errands there, do NOT create a separate generic "go to X" task — the item tasks already imply the trip. Only create one task per item.\n'+
    'If the user dictates a bare list of items to buy/get WITHOUT naming a place (e.g. "купить молоко, хлеб, помидоры, огурцы" / "buy milk, bread, tomatoes, cucumbers") — do NOT create one task per item and do NOT put the list in "text". Instead create ONE task with a short generic name (e.g. "Покупки" / "Groceries", in the voice message\'s language) and put each item as a separate string in "checklist".\n'+
    'Return: {"type":"add","tasks":[{"text":"task name without dates/times/filler","priority":"high|mid|low","date":"YYYY-MM-DD","reminderTime":"HH:MM or empty","checklist":["item1","item2"] or omit/empty if not a shopping list}]}\n'+
    // Без этого правила ЛОМАЛСЯ ЛЮБОЙ следующий список покупок (баг-репорт
    // Александра 2026-08-18). Причина в правиле выше: оно велит называть
    // всякий надиктованный список одинаково — «Покупки». Как только такая
    // задача уже висит, модель видит её среди кандидатов и трактует новый
    // список как ПРАВКУ старого, а applyAiEdit чек-лист не применял вовсе —
    // продиктованные пункты молча исчезали, лимит при этом списывался.
    'A newly dictated list of things to buy or get is ALWAYS a NEW task (type "add"), even if a similar shopping task (for example "Покупки" or "Groceries") already exists. Never treat a fresh list as an edit of that task. The ONLY exception is when the user explicitly asks to add to the existing one (for example "добавь в покупки", "add to my groceries") — then use type "edit" with "checklistAdd".\n'+
    'If a not-completed task with that same generic name already exists, give the new one a slightly more specific name from its content (for example "Покупки в аптеке") so the two are told apart.\n'+
    // Реальный пример от Александра (2026-08-19): жена пишет мужу одним
    // сообщением ДВА разных списка — продукты домой на вечер и отдельно
    // мелочи в конкретном магазине. Без этого правила модель либо сваливала
    // всё в один чек-лист (и человек искал бы хлеб в хозяйственном), либо
    // по правилу выше плодила по задаче на КАЖДЫЙ товар.
    'If the message contains SEVERAL groups of things to buy or get, each tied to a different place or occasion, create a SEPARATE task per group: name the task after that place or occasion, and put only that group items in its "checklist". Do NOT merge the groups into one list, and do NOT create one task per item.' + '\n'+
    // Вступление («Виталя, купи пожалуйста...») — не позиция списка.
    'Greetings, names and polite filler are never checklist items.' + '\n'+
    // Без этой строки модель ВСЕГДА подставляет сегодняшнюю дату (её просят
    // форматом выше) — и надиктованное в разделе «Задачи» улетало в список
    // дел на сегодня. Страховка на клиенте всё равно стоит ниже: модель
    // может по привычке вернуть дату, а раздел обещает бессрочность.
    (undated?'The user is in the "no deadline / someday" section. Return "date":"" (empty string) unless the voice message explicitly names a day or date. Do NOT default to today.\n':'')+
    '\n'+
    '2. EDIT existing task — ONLY when the user is clearly continuing/modifying the SAME task action already in the list (e.g. adding a reminder, moving the date, renaming, changing priority for THAT exact errand). Matching a task by a shared name/keyword (e.g. same person\'s name) is NOT enough — a different action/verb about the same person or place is a NEW task, not an edit. When in doubt, prefer ADD over EDIT.\n'+
    'Return: {"type":"edit","find":"exact or partial task text to find","changes":{"text":"new name if renamed","date":"YYYY-MM-DD if changed","reminderTime":"HH:MM if set/changed","priority":"high|mid|low if changed","checklistAdd":["item1","item2"] only when the user asks to add items to that task checklist}}\n'+
    'Only include fields that actually change. "find" must match part of an existing task text.\n\n'+
    '3. QUESTION — user asks something about their tasks.\n'+
    'Return: {"type":"query","answer":"brief answer in same language","section":"day|week|month or empty"}\n\n'+
    'Return ONLY JSON, no extra text.';
  callAi(prompt,function(err,data){
    state.processing=false;
    if(err&&(err.limit||err.needAuth)){
      addTaskLocallyFromVoice(transcript, dayDate, undated);
      if(err.limit&&maybeShowPaywallOnLimit()) return;
      state.aiAnswer=err.needAuth?L.ai_need_auth:L.ai_limit;
      render(); return;
    }
    if(err||!data||!data.type){
      addTaskLocallyFromVoice(transcript, dayDate, undated);
      // Раньше тут ничего не показывалось — при обрыве сети/сбое ИИ задача
      // тихо создавалась "топорно" (без чек-листа, без нормализации текста),
      // а юзер не понимал, почему. Теперь честно предупреждаем, как и при
      // исчерпанном лимите/невходе (см. ветку выше).
      state.aiAnswer=L.ai_offline;
      render(); return;
    }
    if(data.type==='edit'&&data.find){
      var editRes=applyAiEdit(data.find,data.changes||{});
      if(editRes==='ok'){
        rebalanceSections();
        var editedTask=null;
        for(var s in state.sections){ state.sections[s].forEach(function(t){ if(t.text.toLowerCase().indexOf(data.find.toLowerCase())>=0) editedTask=t; }); }
        var msg=editedTask?('✓ '+esc(editedTask.text)):'✓';
        state.summary=msg;
        if(state.voiceReply) speak(msg);
        anim.summary=true; render();
        scheduleReminders(); syncRemindersToServer();
      } else if(editRes==='nochange'){
        // Задачу нашли, но применить оказалось нечего (модель вернула правку
        // без понятных нам полей). Раньше такой ответ молча проглатывался, а
        // лимит уже был списан — ровно на это жаловался Александр 18.08.
        // Лучше создать задачу из сказанного, чем потерять надиктованное.
        addTaskLocallyFromVoice(transcript, dayDate, undated);
        render();
      } else {
        state.aiAnswer='Задача не найдена: «'+esc(data.find)+'»';
        if(state.voiceReply) speak(state.aiAnswer);
        anim.summary=true; render();
      }
    } else if(data.type==='add'&&data.tasks&&data.tasks.length){
      if(dayDate){ data.tasks.forEach(function(t){ t.date=dayDate; }); state.dsShowAdd=false; }
      // Страховка к подсказке в промпте: если модель всё же вернула
      // сегодняшнее число, считаем это её привычкой, а не словами юзера, —
      // в разделе «Задачи» такое обнуляем. Названную дату («завтра», «в
      // понедельник») не трогаем: она отличается от сегодняшней. Время
      // напоминания тоже оставляет дату — иначе напоминание некуда ставить.
      else if(undated){ data.tasks.forEach(function(t){ if(t.date===today&&!t.reminderTime) t.date=''; }); }
      // Оригинал сказанного — в описание. Промпт описание не запрашивает, и
      // раньше исходное сообщение просто выбрасывалось после разбора: если
      // модель что-то упустила, восстановить было неоткуда (пример с длинным
      // сообщением от жены, 2026-08-19). Кладём только в ПЕРВУЮ задачу и
      // только для длинных сообщений — короткая фраза и так вся в названии,
      // дублировать её незачем.
      if(transcript.length>VOICE_LONG_CHARS && data.tasks[0] && !data.tasks[0].desc){
        data.tasks[0].desc=transcript;
      }
      addTasksBatch(data.tasks, undated);
    } else if(data.type==='query'){
      state.aiAnswer=data.answer||'—';
      if(state.voiceReply) speak(state.aiAnswer);
      if(data.section&&state.sections[data.section]) state.tab=data.section;
      state.view='list';
      anim.summary=true; render();
    } else {
      addTaskLocallyFromVoice(transcript, dayDate, undated);
    }
  });
}

function applyAiEdit(find, changes){
  if(!find||!changes) return 'notfound';
  var fl=find.toLowerCase();
  var found=null, foundSec=null;
  for(var sec in state.sections){
    state.sections[sec].forEach(function(t){
      if(!found&&!t.done&&t.text.toLowerCase().indexOf(fl)>=0){ found=t; foundSec=sec; }
    });
  }
  if(!found) return 'notfound';
  var patch={};
  if(changes.text&&changes.text.trim()) patch.text=changes.text.trim();
  if(changes.date) patch.date=changes.date;
  if(changes.reminderTime!==undefined) patch.reminderTime=changes.reminderTime;
  if(changes.priority&&['high','mid','low'].indexOf(changes.priority)>=0) patch.priority=changes.priority;
  // Дописывание пунктов в чек-лист. Раньше этой ветки не было ВООБЩЕ: если
  // модель возвращала правку с пунктами, они молча пропадали, а лимит уже
  // был списан. Именно так ломался второй список покупок — модель видела
  // висящую задачу «Покупки» и трактовала новый список как правку
  // (баг-репорт Александра 2026-08-18). Дубли не плодим: пункт с таким же
  // текстом просто не добавляем.
  if(Array.isArray(changes.checklistAdd)&&changes.checklistAdd.length){
    var merged=(found.checklist||[]).slice();
    var seen={};
    merged.forEach(function(i){ seen[String(i.text).trim().toLowerCase()]=true; });
    var addedAny=false;
    changes.checklistAdd.forEach(function(raw){
      var txt=String(raw==null?'':raw).trim(); if(!txt) return;
      var low=txt.toLowerCase(); if(seen[low]) return;
      seen[low]=true; merged.push(checklistItem(txt)); addedAny=true;
    });
    if(addedAny){
      patch.checklist=merged;
      // Новый неотмеченный пункт снимает «выполнено» — иначе задача осталась
      // бы зачёркнутой с невыполненным пунктом внутри (та же логика, что в
      // saveEdit и toggleChecklistItem).
      patch.done=merged.every(function(i){return i.done;});
    }
  }
  // Модель сказала «правка», но применять оказалось нечего. Раньше мы всё
  // равно возвращали true, и юзер видел галочку «готово», хотя не изменилось
  // ничего. Возвращаем false — вызывающий код тогда создаст задачу из речи,
  // чтобы сказанное не пропало впустую.
  var touched=false; for(var pk in patch){ touched=true; break; }
  if(!touched) return 'nochange';
  var newSec=patch.date?dateToSection(patch.date):foundSec;
  if(newSec!==foundSec){
    var updated=null;
    state.sections[foundSec]=state.sections[foundSec].filter(function(t){ if(t.id===found.id){updated=Object.assign({},t,patch);return false;} return true; });
    if(updated) state.sections[newSec]=[updated].concat(state.sections[newSec]);
  } else {
    state.sections[foundSec]=state.sections[foundSec].map(function(t){ return t.id===found.id?Object.assign({},t,patch):t; });
  }
  return 'ok';
}

// keepEmptyDate: не подставлять "сегодня" за пустую дату — используется при
// добавлении из раздела «Задачи», где пустая дата осмысленно означает
// "без срока", а не "забыли указать".
function addTasksBatch(tasks, keepEmptyDate){
  if(!tasks||!tasks.length) return;
  var today=todayStr(); var lastSec='day';
  tasks.forEach(function(t){
    var date=t.date||(keepEmptyDate?'':today); var sec=dateToSection(date);
    var safePri=(['high','mid','low'].indexOf(t.priority)>=0)?t.priority:'mid';
    // Принимаем и строки (голосовой/ИИ-разбор), и готовые объекты пункта
    // (форма «Новая задача» хранит state.qaChecklist уже объектами, чтобы
    // показывать их со своими id и кнопкой удаления). Раньше объект молча
    // превращался в «[object Object]» — поймано локальным прогоном 21.08.
    var checklist=Array.isArray(t.checklist)?t.checklist.map(function(s){
      return (s&&typeof s==='object')?String(s.text==null?'':s.text):String(s==null?'':s);
    }).filter(function(s){return s.trim();}).map(function(s){return checklistItem(s.trim());}):[];
    var newTask=T(t.text,safePri,false,t.desc||'',date,t.reminderTime||'',checklist);
    state.sections[sec]=[newTask].concat(state.sections[sec]);
    anim.taskIds[newTask.id]=true; lastSec=sec;
  });
  state.aiAnswer=null;
  if(tasks.length===1) state.summary=L.summary_1+tasks[0].text+L.summary_1e;
  else state.summary=L.summary_n_pre+tasks.length+L.summary_n_suf;
  anim.summary=true;
  if(lastSec==='undated'){ state.view='undated'; } else { state.tab=lastSec; state.view='list'; }
  render(); scheduleReminders(); syncRemindersToServer();
  if(tasks.some(function(t){return t.reminderTime;})) ensureNotifPermission();
}

/* ── Modal AI ── */
function onAiMic(){
  if(state.aiProc) return;
  if(!state.aiRec){
    if(!SpeechRec) return;
    syncEdit(); state.aiNote=''; state.micDenied=false; modalTranscript='';
    var mFinalAcc='';
    var mLastFinalSeg='';
    var rec=new SpeechRec();
    rec.lang=LANG_BCP[voiceLangCode()]||'ru-RU'; rec.continuous=true; rec.interimResults=true;
    // Фикс дублирования на Android (см. основной ввод — там подробный разбор
    // с реальными данными): финальные результаты на этом движке — это вся
    // фраза-с-начала целиком, повторно финализированная по мере роста, а не
    // отдельные новые кусочки. Заменяем накопленный текст последним (самым
    // полным) финалом, если он продолжает предыдущий; иначе дописываем.
    rec.onresult=function(e){
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal){
          var norm=t.trim();
          if(norm){
            var accLow=mFinalAcc.trim().toLowerCase(), normLow=norm.toLowerCase();
            if(normLow!==mLastFinalSeg){
              if(!accLow || normLow.indexOf(accLow)===0) mFinalAcc=norm;
              else mFinalAcc=(mFinalAcc.trim()+' '+norm).trim();
              mLastFinalSeg=normLow;
            }
          }
        } else interim=t;
      }
      var full=(mFinalAcc||interim).trim();
      if(full) modalTranscript=full;
    };
    rec.onerror=function(ev){
      if(ev.error==='no-speech'||ev.error==='aborted') return;
      state.aiRec=false; state.aiProc=false; modalRecObj=null;
      if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ state.micDenied=true; state.aiNote='⚠️ '+L.mic_denied; anim.aiNote=true; }
      render();
    };
    rec.onend=function(){
      if(state.aiRec){ try{ rec.start(); }catch(e){ state.aiRec=false; state.aiProc=true; modalRecObj=null; render(); var mToProcess=modalTranscript; modalTranscript=''; aiApply(mToProcess); } }
    };
    rec.start(); modalRecObj=rec;
    state.aiRec=true; render();
  } else {
    syncEdit(); state.aiRec=false; state.aiProc=true;
    if(modalRecObj){ modalRecObj.stop(); modalRecObj=null; }
    render(); if(modalTranscript){ var mStopText=modalTranscript; modalTranscript=''; aiApply(mStopText); }
  }
}

function aiApply(transcript){
  aiTimeout=null; var m=state.modal;
  if(!m){state.aiProc=false;render();return;}
  var isEdit=state.modalMode==='edit';
  var src=isEdit?(state.edit||{}):currentTask();
  if(!src){state.aiProc=false;render();return;}
  var today=todayStr();
  var prompt='You are a task editor. The task is: name="'+((src.text)||'')+'", date="'+(src.date||'')+'", reminderTime="'+(src.reminderTime||'')+'". The user said: "'+transcript+'". Figure out what the user wants to change and output the new values. For any field the user did NOT mention, output an empty string "" meaning keep the current value. Never invent changes the user did not ask for. Today is '+today+'. Output ONLY this JSON, nothing else: {"text":"","priority":"","desc":"","date":"","reminderTime":""}. Rules: text=new name if renamed; priority=high|mid|low if changed; desc=new description if added; date=YYYY-MM-DD if date changed; reminderTime=HH:MM 24h if a time is set ("9 утра"->"09:00","9 вечера"->"21:00"), or null to remove a reminder. Examples: "напомни в 9 утра"->{"text":"","priority":"","desc":"","date":"","reminderTime":"09:00"}; "убери напоминание"->{"text":"","priority":"","desc":"","date":"","reminderTime":null}; "переименуй в купить хлеб"->{"text":"купить хлеб","priority":"","desc":"","date":"","reminderTime":""}; "высокий приоритет"->{"text":"","priority":"high","desc":"","date":"","reminderTime":""}.';
  callAi(prompt,function(err,data){
    if(err&&err.needAuth){ state.aiProc=false; state.aiNote='⚠️ '+L.ai_need_auth; anim.aiNote=true; render(); }
    else if(err&&err.limit){ state.aiProc=false; if(maybeShowPaywallOnLimit()) return; state.aiNote='⚠️ '+L.ai_limit; anim.aiNote=true; render(); }
    else if(err||!data){ state.aiProc=false; state.aiNote='⚠️ AI'; anim.aiNote=true; render(); }
    else applyEdit(data,isEdit,m,'✓ AI');
  });
}

function applyEdit(data,isEdit,m,note){
  var validPri=['high','mid','low'];
  var newRem=data.reminderTime===null?'':(data.reminderTime||null);
  var dataText=data.text?clampLen(data.text,LEN_TITLE):data.text;
  var dataDesc=data.desc?clampLen(data.desc,LEN_DESC):data.desc;
  if(isEdit){
    var ed=state.edit||{};
    state.edit=Object.assign({},ed,{
      text:dataText||ed.text,
      desc:dataDesc?dataDesc:ed.desc,
      priority:(validPri.indexOf(data.priority)>=0?data.priority:null)||ed.priority,
      date:data.date?data.date:ed.date,
      reminderTime:newRem!==null?newRem:ed.reminderTime,
    });
  } else {
    state.sections[m.section]=state.sections[m.section].map(function(t){
      if(t.id!==m.id) return t;
      var sp=(validPri.indexOf(data.priority)>=0?data.priority:null)||t.priority;
      var rt=newRem!==null?newRem:t.reminderTime;
      return Object.assign({},t,{text:dataText||t.text,desc:dataDesc?dataDesc:t.desc,priority:sp,date:data.date?data.date:t.date,reminderTime:rt});
    });
  }
  saveStorage();
  // Голосовая правка ПРЯМО из просмотра карточки (не через форму
  // "Редактировать") меняет task.date в текущей секции, но не переносит
  // задачу в секцию, которой теперь соответствует новая дата (day/week/
  // month — это отдельные массивы, а не вычисляемое свойство). Раньше это
  // "чинилось" только rebalanceSections() при перезагрузке/возврате в
  // приложение — снаружи выглядело как "перенос применяется только после
  // перезагрузки" (баг с телефона Александра, 2026-07-14).
  if(!isEdit){
    rebalanceSections();
    // rebalanceSections() могла физически переложить задачу в другой массив
    // (day→week/month) — модалка ищет задачу по старой m.section
    // (currentTask()), без этого карточка молча "исчезнет" сразу после
    // применения правки, т.к. currentTask() не найдёт её в старой секции.
    state.modal.section=findTaskSection({id:m.id});
    scheduleReminders(); syncRemindersToServer(); if(data.reminderTime) ensureNotifPermission();
  }
  state.aiProc=false; state.aiNote=note||'✓ AI'; anim.aiNote=true; render();
}

/* ── TTS ── */
var ttsUnlocked=false;
var cachedVoices=null;
if(window.speechSynthesis){
  speechSynthesis.addEventListener('voiceschanged',function(){ cachedVoices=speechSynthesis.getVoices(); });
}
function unlockTts(){
  if(ttsUnlocked||!window.speechSynthesis) return;
  var u=new SpeechSynthesisUtterance('');
  speechSynthesis.speak(u);
  ttsUnlocked=true;
}
function pickVoice(lang){
  var voices=cachedVoices||speechSynthesis.getVoices();
  if(!voices||!voices.length) return null;
  var preferred={
    'ru':['Milena','Yuri','Google русский','Microsoft Irina','ru-RU'],
    'en':['Samantha','Google US English','Microsoft Zira','en-US'],
    'uk':['Google українська','uk-UA'],
    'de':['Anna','Google Deutsch','Microsoft Hedda','de-DE'],
    'fr':['Amelie','Thomas','Google français','Microsoft Hortense','fr-FR']
  };
  var names=preferred[lang]||[];
  for(var i=0;i<names.length;i++){
    for(var j=0;j<voices.length;j++){
      if(voices[j].name.indexOf(names[i])!==-1) return voices[j];
    }
  }
  var bcp=LANG_BCP[lang]||'ru-RU';
  for(var k=0;k<voices.length;k++){
    if(voices[k].lang===bcp) return voices[k];
  }
  return null;
}
function speak(text){
  if(!window.speechSynthesis||!text) return;
  speechSynthesis.cancel();
  if(speechSynthesis.paused) speechSynthesis.resume();
  var u=new SpeechSynthesisUtterance(text);
  // Читаем языком РЕЧИ, а не интерфейса: ИИ отвечает на языке сказанного
  // (это прописано в промпте), и озвучивать русский ответ английским
  // голосом бессмысленно.
  u.lang=LANG_BCP[voiceLangCode()]||'ru-RU';
  u.rate=1.0;
  var v=pickVoice(voiceLangCode());
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

/* ── AI Analyze ── */
function aiAnalyze(){
  if(state.aiAnalyzing) return;
  var tasks=allTasks().filter(function(t){return !t.done;});
  if(!tasks.length){ if(state.voiceReply) speak(L.summary_default); return; }
  state.aiAnalyzing=true; state.summary=L.analyzing; render();
  var today=todayStr();
  var prompt='Today is '+today+'. Pending tasks: '+JSON.stringify(tasks.map(function(t){return {text:t.text,date:t.date||'',priority:t.priority};}))+'. Give brief priority advice (2-3 sentences). Respond in the same language as the task names. Return ONLY JSON: {"advice":"your advice text"}';
  callAi(prompt,function(err,data){
    state.aiAnalyzing=false;
    if(err&&err.limit&&maybeShowPaywallOnLimit()) return;
    state.summary=(err&&err.needAuth)?L.ai_need_auth:(err&&err.limit)?L.ai_limit:(!err&&data&&data.advice)?data.advice:L.summary_default;
    if(state.voiceReply) speak(state.summary);
    render();
  });
}

/* ── Общее плавное закрытие шторок (карточка задачи, день, быстрое добавление) ──
   Уезд вниз + затухание фона, done() (реальное закрытие state+render) — после
   анимации. Тот же приём reflow+rAF, что и в closeSettings (иначе на iOS резко). */
var _sheetClosing={};
function closeSheetAnimated(key, done){
  if(_sheetClosing[key]) return;
  var sheet=document.querySelector('.sheet[data-sheet="'+key+'"]');
  if(!sheet){ done(); return; }
  var scrim=sheet.parentElement?sheet.parentElement.querySelector('.scrim'):null;
  _sheetClosing[key]=true;
  sheet.style.animation='none';
  // См. комментарий в closeSettings() — при закрытии свайпом transform уже
  // стоит на точке протяжки, сбрасывать в 0 нельзя (двойное мигание).
  if(!sheet.style.transform) sheet.style.transform='translateY(0)';
  void sheet.offsetHeight;
  requestAnimationFrame(function(){
    sheet.style.transition='transform .28s cubic-bezier(.4,0,.2,1)';
    sheet.style.transform='translateY(100%)';
    if(scrim){ scrim.style.transition='opacity .28s ease'; scrim.style.opacity='0'; }
  });
  setTimeout(function(){ _sheetClosing[key]=false; done(); },300);
}

/* ── Paywall (PRO) ── */
function openPaywall(){ state.paywall=true; anim.paywall=true; state.aiNote=''; render(); }
function closePaywall(){ closeSheetAnimated('paywall', function(){ state.paywall=false; state.aiNote=''; render(); }); }
// Показываем Paywall САМИ, без действия юзера, только ОДИН раз — в момент первого
// исчерпания лимита. Дальше при каждом новом исчерпании лимита юзер видит просто
// нейтральное сообщение (L.ai_limit), НЕ Paywall повторно — иначе это раздражает
// тех, кто просто тестирует бесплатную версию (явное пожелание Александра,
// 2026-07-15). Открыть Paywall снова можно только вручную — кнопка в Настройках.
// Digital Goods API: подписка в TWA продаётся через стандартный веб-API
// PaymentRequest с методом "https://play.google.com/billing" — нативный мост
// (addJavascriptInterface) тут не нужен и не может работать, т.к. TWA рендерит
// страницу через системный Chrome, а не собственный WebView приложения.
// purchaseToken из ответа PaymentRequest уходит на /verify-purchase на сервере,
// который проверяет его через Google Play Developer API (service account) и
// выдаёт лимит PRO.
var PRO_PRODUCT_ID = 'mynado_pro_monthly';
function startProPurchase(){
  if(!window.PaymentRequest){
    state.aiNote='⚠️ Подписка доступна только в приложении Mynado из Google Play'; anim.aiNote=true; render();
    return;
  }
  if(!isGoogleSignedIn()){
    handleAuthFailure(function(){ startProPurchase(); }, function(){
      state.aiNote='⚠️ Нужно войти через Google, чтобы оформить подписку'; anim.aiNote=true; render();
    });
    return;
  }
  var method = {
    supportedMethods: 'https://play.google.com/billing',
    data: { sku: PRO_PRODUCT_ID }
  };
  var request;
  try{
    request = new PaymentRequest([method], { total: { label: 'Mynado PRO', amount: { currency: 'USD', value: '0' } } });
  }catch(e){
    state.aiNote='⚠️ Не удалось открыть оплату'; anim.aiNote=true; render();
    return;
  }
  state.proPurchasePending = true; render();
  request.show()
    .then(function(paymentResponse){
      var purchaseToken = paymentResponse.details && paymentResponse.details.purchaseToken;
      if(!purchaseToken){
        return paymentResponse.complete('fail').then(function(){ throw new Error('no purchaseToken'); });
      }
      return fetch(WORKER_URL+'/verify-purchase',{
        method:'POST',
        headers:{'content-type':'application/json','Authorization':'Bearer '+getGoogleToken()},
        body: JSON.stringify({ purchaseToken: purchaseToken })
      })
      .then(function(r){ return r.json(); })
      // Сеть отвалилась / сервер вернул не-JSON — раньше исключение улетало
      // мимо complete(), и шторка оплаты Google Play оставалась висеть: она
      // ждёт complete() как сигнал "транзакция обработана" (аудит 2026-08-17,
      // п.№7). Ловим ЗДЕСЬ, чтобы complete('fail') ниже отработал в любом
      // случае, и отдаём наверх обычный "не подтвердилось" вместо падения.
      .catch(function(){ return null; })
      .then(function(data){
        return paymentResponse.complete(data && data.ok ? 'success' : 'fail')
          .catch(function(){})   // сама complete() тоже может отвалиться — не роняем цепочку
          .then(function(){ return data; });
      });
    })
    .then(function(data){
      state.proPurchasePending = false;
      if(data && data.ok){
        saveLimitInfo(data.limit,false,true);
        state.paywall = false;
        state.aiNote = L.pro_purchase_success;
        anim.aiNote = true; render();
        refreshAiLimit();
      }else{
        state.aiNote=L.pro_verify_failed; anim.aiNote=true; render();
      }
    })
    .catch(function(err){
      state.proPurchasePending = false;
      if(err && err.name === 'AbortError'){ render(); return; }
      state.aiNote=L.pro_payment_failed; anim.aiNote=true; render();
    });
}

// Восстановление подписки (2026-07-22): Google Play не даёт купить SKU второй
// раз, если у аккаунта уже есть активная подписка ("Ви вже маєте підписку") —
// PaymentRequest.show() в этом случае просто отклоняется без нового
// purchaseToken. Нужно, если /verify-purchase не смог отработать при самой
// покупке (например сеть/сбой сервера) — тогда Google уже считает юзера
// подписчиком, а наш сервер об этом не узнал. Digital Goods API даёт токен
// УЖЕ существующей покупки без повторной оплаты.
function restorePendingPurchase(){
  if(!isGoogleSignedIn()){
    handleAuthFailure(function(){ restorePendingPurchase(); }, function(){
      state.aiNote=L.pro_restore_need_auth; anim.aiNote=true; render();
    });
    return;
  }
  if(!('getDigitalGoodsService' in window)){
    state.aiNote=L.pro_restore_unsupported; anim.aiNote=true; render();
    return;
  }
  state.proPurchasePending = true; render();
  window.getDigitalGoodsService('https://play.google.com/billing')
    .then(function(service){ return service.listPurchases(); })
    .then(function(purchases){
      var p = (purchases||[]).filter(function(x){ return x.itemId===PRO_PRODUCT_ID; })[0];
      if(!p || !p.purchaseToken) throw { restoreNone: true };
      return fetch(WORKER_URL+'/verify-purchase',{
        method:'POST',
        headers:{'content-type':'application/json','Authorization':'Bearer '+getGoogleToken()},
        body: JSON.stringify({ purchaseToken: p.purchaseToken })
      }).then(function(r){ return r.json(); });
    })
    .then(function(data){
      state.proPurchasePending = false;
      if(data && data.ok){
        saveLimitInfo(data.limit,false,true);
        state.paywall = false;
        state.aiNote = L.pro_purchase_success;
        anim.aiNote = true; render();
        refreshAiLimit();
      }else{
        state.aiNote=L.pro_verify_failed; anim.aiNote=true; render();
      }
    })
    .catch(function(err){
      state.proPurchasePending = false;
      state.aiNote = (err && err.restoreNone) ? L.pro_restore_none : L.pro_verify_failed;
      anim.aiNote=true; render();
    });
}

function maybeShowPaywallOnLimit(){
  try{
    if(localStorage.getItem('vtodo-paywall-shown')) return false;
    localStorage.setItem('vtodo-paywall-shown','1');
  }catch(e){ return false; }
  openPaywall();
  return true;
}

/* ── Settings ── */
var settingsCloseTimer=null;
function openSettings(){ if(settingsCloseTimer){clearTimeout(settingsCloseTimer);settingsCloseTimer=null;} state.fabOpen=false; state.settings=true; anim.settings=true; render(); refreshAiLimit(); }
function closeSettings(){
  if(settingsCloseTimer) return; // уже закрывается
  var sheet=document.querySelector('.sheet[data-sheet-drag="settings"]');
  var scrim=sheet&&sheet.parentElement?sheet.parentElement.querySelector('.scrim'):null;
  if(!sheet){ state.settings=false; render(); return; }
  // Плавный уезд вниз + затухание фона, затем убираем из DOM.
  // ВАЖНО: анимацию открытия (sheetup, fill-mode:both удерживает transform)
  // снимаем и ФОРСИМ reflow ДО установки transition/transform. Без reflow в
  // одном кадре iOS Safari не запускает transition — шторка исчезает резко
  // (проявлялось: плавно только когда между открытием и закрытием случался
  // лишний render, напр. после входа через Google).
  sheet.style.animation='none';
  // Если закрытие пришло из свайпа — sheet.style.transform уже стоит на
  // текущей точке протяжки (см. sheetDrag ниже), и её нельзя сбрасывать в 0:
  // иначе шторка на кадр прыгает обратно наверх и только потом едет вниз —
  // выглядит как двойное мигание (найдено 2026-07-21). Сбрасываем в 0 только
  // когда transform ещё не задан явно (закрытие по кнопке/тапу на фон).
  if(!sheet.style.transform) sheet.style.transform='translateY(0)';
  void sheet.offsetHeight; // форс reflow — фиксируем стартовую точку перехода
  requestAnimationFrame(function(){
    sheet.style.transition='transform .28s cubic-bezier(.4,0,.2,1)';
    sheet.style.transform='translateY(100%)';
    if(scrim){ scrim.style.transition='opacity .28s ease'; scrim.style.opacity='0'; }
  });
  settingsCloseTimer=setTimeout(function(){ settingsCloseTimer=null; state.settings=false; render(); },300);
}
// Раньше чистило только localStorage — задачи, напоминания и push-подписки,
// уже засинканные на сервер (см. doSyncTasksToServer), там и оставались,
// хотя privacy.html/delete-data.html обещают, что "Очистить все данные"
// удаляет их и там тоже. Нашли и закрыли 2026-07-26: сперва зовём
// /account/wipe (только у вошедших — без входа синка вообще не было и
// стирать на сервере нечего), и в любом случае, даже если сервер недоступен,
// чистим локально — кнопка не должна зависать офлайн.
/* ── Общие группы (2026-07-28) ──
   Отдельный, самостоятельный путь данных, НЕ переиспользует state.sections/
   toggleDone/openModal и т.п. — та машинерия рассчитана на локальные-первым
   личные задачи с последующим фоновым синком, а тут сервер авторитетен
   сразу (несколько живых людей правят один список), плюс разные роли что
   разрешают, что нет. Проще и надёжнее держать отдельно, чем подмешивать
   особые случаи в уже сложный личный путь. */
// Отметки «когда я последний раз видел эту группу». Сравниваем с lastChange
// из /groups и рисуем точку на вкладке, если кто-то что-то менял после.
// Пуш на каждую задачу сознательно НЕ делаем: в группе из нескольких человек
// это превратится в поток уведомлений и в расход квоты (вопрос Александра
// 2026-08-18). Точка — тихий вариант: не будит телефон, но не даёт пропустить.
var GROUP_SEEN_KEY='vtodo-group-seen';
function getGroupSeen(){ try{ return JSON.parse(localStorage.getItem(GROUP_SEEN_KEY)||'{}'); }catch(e){ return {}; } }
function markGroupSeen(gid){
  if(!gid) return;
  var m=getGroupSeen(); m[gid]=Date.now();
  try{ localStorage.setItem(GROUP_SEEN_KEY,JSON.stringify(m)); }catch(e){}
}
// Есть ли хоть одна группа с чужими изменениями с прошлого захода.
function hasGroupUpdates(){
  var seen=getGroupSeen();
  for(var i=0;i<state.groupsList.length;i++){
    var g=state.groupsList[i];
    if(!g.lastChange) continue;
    if(g.lastChange>(seen[g.groupId]||0)) return true;
  }
  return false;
}

function groupAuthHeaders(){ return {'content-type':'application/json','Authorization':'Bearer '+getGoogleToken()}; }
function groupRoleLabel(role){
  return role==='admin'?L.groups_role_admin:role==='editor'?L.groups_role_editor:role==='viewer_check'?L.groups_role_viewer_check:L.groups_role_viewer;
}

function fetchMyGroups(cb){
  if(!isGoogleSignedIn()){ state.groupsList=[]; state.groupsLoaded=true; if(cb) cb(); return; }
  fetch(WORKER_URL+'/groups',{headers:{'Authorization':'Bearer '+getGoogleToken()}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(data){
      state.groupsList=(data&&data.groups)?data.groups:[];
      state.groupsLoaded=true; render();
      if(cb) cb();
    }).catch(function(){ state.groupsLoaded=true; render(); if(cb) cb(); });
}

function createGroup(){
  var name=(state.gCreateName||'').trim();
  if(!name) return;
  fetch(WORKER_URL+'/group/create',{method:'POST',headers:groupAuthHeaders(),body:JSON.stringify({name:name})})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(data){
      if(!data||!data.groupId) return;
      state.gCreateOpen=false; state.gCreateName='';
      fetchMyGroups(function(){ openGroup(data.groupId); });

function openGroup(groupId){
  var g=null;
  for(var i=0;i<state.groupsList.length;i++) if(state.groupsList[i].groupId===groupId) g=state.groupsList[i];
  if(!g) return;
  markGroupSeen(groupId); // свои заходы точку не зажигают
  state.groupOpen=g; state.groupSub='tasks';
  state.groupTasks=[]; state.groupTasksLoaded=false;
  state.groupTrash=[]; state.groupTrashLoaded=false;
  state.groupMembers=[]; state.groupMembersLoaded=false;
  render();
  pullGroupTasks();
}
function closeGroup(){ state.gSettings=false; state.groupOpen=null; state.groupSub='tasks'; render(); }

/* ── Автообновление общих списков (2026-08-17, аудит п.№3) ──
   Раньше pullGroupTasks() звался ТОЛЬКО из openGroup(): visibilitychange
   подтягивал личные задачи, а групповые — нет. Для фичи «общий список на
   несколько живых людей» это ломало главный сценарий: чтобы увидеть, что
   напарник добавил или отметил задачу, приходилось выйти из группы и зайти
   заново. Теперь тянем и при возврате в приложение, и лёгким поллингом,
   пока экран группы открыт.
   Наивный поллинг тут ОПАСЕН по двум причинам, обе учтены ниже:
   1) render() пересобирает весь DOM — обновление в момент, когда человек
      печатает, сбрасывало бы фокус, каретку и закрывало клавиатуру. Поэтому
      сравниваем сигнатуру содержимого и вообще не трогаем DOM, если ничего
      не изменилось (тот же приём диффинга, что у синка задач в KV).
   2) KV у Cloudflare ЭВЕНТУАЛЬНО согласован — чтение сразу после своей же
      записи может вернуть старые данные и визуально ОТКАТИТЬ только что
      сделанное. Поэтому опрос молчит, пока свои записи в полёте, и ещё
      GROUP_WRITE_SETTLE_MS после последней. */
function groupListSig(list){
  return JSON.stringify((list||[]).map(function(t){
    return [t.syncId,t.text,t.desc,t.priority,t.done,t.date,t.reminderTime,t.checklist,t.notifyUids];
  }));
}
// Счётчик своих незавершённых записей + момент последней. Пока он не ноль
// (или прошло мало времени), опрос не перетирает оптимистично показанное.
var groupWriteBusy=0, groupWriteDoneAt=0, GROUP_WRITE_SETTLE_MS=5000;
function groupWriteStart(){ groupWriteBusy++; }
function groupWriteEnd(){ groupWriteBusy=Math.max(0,groupWriteBusy-1); groupWriteDoneAt=Date.now(); }

function pullGroupTasks(quiet){
  var g=state.groupOpen; if(!g) return;
  var gid=g.groupId;
  fetch(WORKER_URL+'/group/tasks?groupId='+encodeURIComponent(gid),{headers:{'Authorization':'Bearer '+getGoogleToken()}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(data){
      // Группу могли закрыть или переключить, пока запрос летел — иначе
      // ответ старой группы затирал бы список новой.
      if(!state.groupOpen||state.groupOpen.groupId!==gid) return;
      var next=(data&&data.tasks)?data.tasks:[];
      if(quiet){
        if(!groupPollSafe()) return; // свои записи ещё не осели — ответ мог быть устаревшим
        if(groupListSig(next)===groupListSig(state.groupTasks)) return; // ничего не изменилось
      }
      state.groupTasks=next; state.groupTasksLoaded=true; markGroupSeen(gid); render();
    })
    .catch(function(){ if(quiet) return; if(!state.groupOpen||state.groupOpen.groupId!==gid) return; state.groupTasksLoaded=true; render(); });
}
function pullGroupTrash(quiet){
  var g=state.groupOpen; if(!g) return;
  var gid=g.groupId;
  fetch(WORKER_URL+'/group/tasks?groupId='+encodeURIComponent(gid)+'&trash=1',{headers:{'Authorization':'Bearer '+getGoogleToken()}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(data){
      if(!state.groupOpen||state.groupOpen.groupId!==gid) return;
      var next=(data&&data.tasks)?data.tasks:[];
      if(quiet){
        if(!groupPollSafe()) return;
        if(groupListSig(next)===groupListSig(state.groupTrash)) return;
      }
      state.groupTrash=next; state.groupTrashLoaded=true; render();
    })
    .catch(function(){ if(quiet) return; if(!state.groupOpen||state.groupOpen.groupId!==gid) return; state.groupTrashLoaded=true; render(); });
}
function pullGroupMembers(quiet){
  var g=state.groupOpen; if(!g) return;
  var gid=g.groupId;
  fetch(WORKER_URL+'/group/members?groupId='+encodeURIComponent(gid),{headers:{'Authorization':'Bearer '+getGoogleToken()}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(data){
      if(!state.groupOpen||state.groupOpen.groupId!==gid) return;
      var next=(data&&data.members)?data.members:[];
      if(quiet){
        if(!groupPollSafe()) return;
        if(JSON.stringify(next)===JSON.stringify(state.groupMembers)) return;
      }
      state.groupMembers=next; state.groupMembersLoaded=true; render();
    })
    .catch(function(){ if(quiet) return; if(!state.groupOpen||state.groupOpen.groupId!==gid) return; state.groupMembersLoaded=true; render(); });
}

/* Можно ли сейчас незаметно обновить экран группы. Одна проверка на все
   поводы промолчать — вызывается и перед запросом, и ещё раз при ответе
   (за время полёта человек мог начать печатать). */
function groupPollSafe(){
  if(document.visibilityState!=='visible') return false;
  if(!navigator.onLine||!isGoogleSignedIn()) return false;
  if(state.view!=='groups'||!state.groupOpen) return false;
  // Открыта шторка редактирования/подтверждения — render() пересобрал бы её
  // прямо под пальцем.
  if(state.gEdit||state.ask) return false;
  // Человек печатает (новая задача, приглашение, название группы) — молчим,
  // иначе перерисовка съест введённый текст и уберёт клавиатуру.
  var ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return false;
  // Свои записи ещё в полёте или только что прошли — KV мог не догнать.
  if(groupWriteBusy>0) return false;
  if(Date.now()-groupWriteDoneAt<GROUP_WRITE_SETTLE_MS) return false;
  return true;
}
// Нижний предел между опросами, независимо от поводa. Нужен потому, что
// groupPollTick зовётся НЕ только по интервалу, но и на каждый
// visibilitychange — а тот приходит пачками (быстрое переключение между
// приложениями, шторка уведомлений, смена фокуса). Замерено в браузере
// 2026-08-17: без этого предела получалось ~16 запросов за 26 секунд вместо
// одного. Квоту KV в этом проекте уже дважды сжигали, так что дешёвая
// защита тут уместнее, чем надежда на аккуратность поводов.
var GROUP_POLL_MIN_GAP_MS=8000, groupPollLastAt=0;
// Одиночный интервал, который сам решает, надо ли что-то делать — так не
// приходится заводить start/stop в каждом пути навигации (тот же приём, что
// у setInterval(checkReminders) ниже).
function groupPollTick(){
  if(!groupPollSafe()) return;
  // Предел проверяем ЗДЕСЬ, а не в groupPollSafe(): та вызывается второй раз
  // при получении ответа, и метка, поставленная перед запросом, гасила бы
  // собственный ответ.
  if(Date.now()-groupPollLastAt<GROUP_POLL_MIN_GAP_MS) return;
  groupPollLastAt=Date.now();
  if(state.groupSub==='members') pullGroupMembers(true);
  else if(state.groupSub==='trash') pullGroupTrash(true);
  else pullGroupTasks(true);
}
setInterval(groupPollTick, 20000);

function groupAddTask(){
  var g=state.groupOpen; if(!g||(g.role!=='admin'&&g.role!=='editor')) return;
  var text=clampLen((state.gAddText||'').trim(),LEN_TITLE); if(!text) return;
  var syncId=getDeviceId()+'-g'+Date.now().toString(36);
  var now=Date.now();
  var newTask={syncId:syncId,text:text,desc:'',priority:state.gAddPri,done:false,date:'',checklist:[],deviceId:getDeviceId(),updatedAt:now,createdBy:getUserKey(),updatedBy:getUserKey()};
  state.groupTasks=[newTask].concat(state.groupTasks);
  state.gAddText=''; render();
  groupWriteStart();
  fetch(WORKER_URL+'/group/task',{method:'POST',headers:groupAuthHeaders(),body:JSON.stringify({
    groupId:g.groupId, syncId:syncId, deviceId:getDeviceId(), updatedAt:now,
    text:text, desc:'', priority:state.gAddPri, done:false, date:'', checklist:[]
  })}).then(function(r){ groupWriteEnd(); markGroupSeen(g.groupId); if(!r||!r.ok) pullGroupTasks(); }).catch(function(){ groupWriteEnd(); pullGroupTasks(); });
}

function groupToggleDone(syncId){
  var g=state.groupOpen; if(!g||g.role==='viewer') return;
  var task=null;
  state.groupTasks=state.groupTasks.map(function(t){ if(t.syncId===syncId){ task=Object.assign({},t,{done:!t.done}); return task; } return t; });
  render();
  if(!task) return;

function clearAllData(){
  function wipeLocal(){
    try{
      var keys=[];
      for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('vtodo-')===0) keys.push(k); }
      keys.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
    location.reload();
  }
  if(!isGoogleSignedIn()){ wipeLocal(); return; }
  fetch(WORKER_URL+'/account/wipe',{method:'POST',
    headers:{'Authorization':'Bearer '+getGoogleToken()}
  }).then(function(){
    // /account/wipe сносит sub:/rem: на сервере, но САМА подписка в браузере
    // оставалась активной — устройство продолжало числиться подписанным и
    // при следующем входе молча переиспользовало старый endpoint
    // (см. ветку `if(existing)` в subscribePush). Снимаем и её.
    return unsubscribePushForSignOut();
  }).catch(function(){}).then(wipeLocal);
}

// Мягкий выход — в отличие от clearAllData() НИЧЕГО не трогает на сервере
// (/account/wipe не зовётся). Только забывает вход и локальный кэш ЭТОГО
// устройства, так что при следующем открытии — экран входа. Ровно то, что
// нужно при переезде на новый телефон: выйти со старого, войти на новом,
// задачи целы на сервере. Чистим и vtodo-v2/vtodo-task-synced-v1 тоже —
// иначе, если потом на этом же устройстве войдут ДРУГИМ аккаунтом, чужие
// локальные задачи могли бы примешаться и уйти на сервер новому юзеру.
// Снимает push-подписку ЭТОГО устройства: сначала на сервере (иначе там
// остаётся живая sub:<аккаунт>:<устройство> + уже разложенные rem:-записи),
// потом в самом браузере. Возвращает промис, который ВСЕГДА резолвится —
// выход не должен зависеть от сети (аудит 2026-08-17, п.№2).
function unsubscribePushForSignOut(){
  return new Promise(function(resolve){
    // Потолок ожидания: без сети fetch может висеть долго, а человек ждёт
    // выхода. Локальную часть выхода это не задерживает — она идёт в любом
    // случае, просто серверная запись останется до следующего входа.
    var done=false;
    var finish=function(){ if(done) return; done=true; resolve(); };
    setTimeout(finish,4000);
    if(!('serviceWorker' in navigator)){ finish(); return; }
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription();
    }).then(function(sub){
      if(!sub) return;
      var endpoint=sub.endpoint;
      // ВАЖНО: отписку в браузере делаем ВСЕГДА, даже если токен протух и на
      // сервер сходить нечем. Из аккаунта чаще всего выходят как раз когда
      // сессия просрочена — а проверка isGoogleSignedIn() ПЕРЕД всем блоком
      // (как было в первой версии этого фикса) в этом самом частом случае
      // пропускала вообще всё, и утечка оставалась. Смерть endpoint'а —
      // решающая половина: сервер при следующей рассылке получит 410, а
      // устройство перестаёт получать чужие напоминания сразу.
      var serverPart=isGoogleSignedIn()
        ? fetch(WORKER_URL+'/unsubscribe',{method:'POST',
            headers:{'content-type':'application/json','Authorization':'Bearer '+getGoogleToken()},
            body:JSON.stringify({deviceId:getDeviceId(),endpoint:endpoint})
          }).catch(function(){})
        : Promise.resolve();
      // Сначала сервер, потом браузер: серверу нужен ещё живой endpoint,
      // чтобы сверить его со старой (без deviceId) записью sub:<аккаунт>.
      return serverPart.then(function(){ return sub.unsubscribe().catch(function(){}); });
    }).then(finish).catch(finish);
  });
}

// Мягкий выход: НИЧЕГО не трогает на сервере, кроме push-подписки этого
// устройства (см. выше) — задачи остаются целы, ровно как нужно при переезде
// на новый телефон.
function signOutDevice(){
  try{ if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
  unsubscribePushForSignOut().then(function(){
    try{
      // Раньше чистился только этот список — и остальные vtodo-ключи
      // переживали выход. Самое неприятное: vtodo-ai-limit-info с чужим PRO
      // (следующий аккаунт на этом телефоне до ответа /limit видел чужой
      // бейдж и лимит), плюс vtodo-fired/vtodo-paywall-shown/vtodo-push-was-ok
      // от прошлого владельца. Проще и надёжнее снести ВСЁ пространство
      // vtodo-* и оставить лишь то, что осмысленно пережить выход:
      // vtodo-device-id (иначе на сервере копятся мёртвые слоты устройств
      // при каждом перезаходе) и vtodo-uid-hwm (монотонный счётчик id —
      // если его обнулить, новые локальные id столкнутся со старыми syncId,
      // уже лежащими на сервере, см. комментарий у UID_HWM_KEY).
      var keep={'vtodo-device-id':1,'vtodo-uid-hwm':1};
      var kill=[];
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf('vtodo-')===0&&!keep[k]) kill.push(k);
      }
      kill.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
    location.reload();
  });
}
