<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mynado</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mynado">
<!-- Единственный тег, без media-условия: раньше их было два, переключаемых
     через prefers-color-scheme — то есть по СИСТЕМНОЙ теме телефона. Ручной
     переключатель ☀️/🌙 внутри приложения красит только содержимое страницы
     (data-theme), а верхнюю плашку не трогал вообще — расхождение видно,
     когда юзер переключил тему в приложении, а тема телефона осталась
     прежней (найдено 2026-07-27). Теперь JS сам держит content в ногу с
     state.theme — см. render(). -->
<meta name="theme-color" content="#f5f2ec" id="theme-color-meta">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
/* Жёсткая блокировка прокрутки body: без неё iOS «резиново» тянет весь
   интерфейс (rubber-band) при свайпе на границе прокрутки — особенно после
   того как Google Sign-In подгружает свой скрытый iframe в body. Скроллятся
   только внутренние области (.scroll-area / .sheet-body), а не вся страница. */
html, body { overflow: hidden; overscroll-behavior: none; position: fixed; width: 100%; }
body {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
input, textarea, [contenteditable="true"], [contenteditable=""] {
  -webkit-user-select: text; user-select: text;
  -webkit-touch-callout: default;
}

:root {
  color-scheme: light;
  --screen:#f5f2ec; --surface:#fff; --surface2:#ece7dd;
  --text:#2c2a26; --muted:#8c867b; --border:rgba(44,42,38,.09); --border-strong:rgba(44,42,38,.35);
  --accent:#22375c; --accent-soft:#e6eaf2; --accent-ink:#8a6a1c;
  --sage:#d3e6d8; --sage-ink:#3c6450;
  --rose:#ecd9d3; --rose-ink:#8a5446;
  --blue:#d6deeb; --blue-ink:#465a86;
  --pri-high:#e7b3a6; --pri-high-ink:#8a4133;
  --pri-mid:#ebd4a0;  --pri-mid-ink:#85652c;
  --pri-low:#bcd9c4;  --pri-low-ink:#3f6850;
}
[data-theme="dark"] {
  color-scheme: dark;
  --screen:#1a1922; --surface:#252332; --surface2:#2e2b3d;
  --text:#ecebf2; --muted:#9b97ad; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.30);
  --accent:#5170ad; --accent-soft:#28324c; --accent-ink:#e6c56e;
  --sage:#2f4a3e; --sage-ink:#bfe0cc;
  --rose:#4a3a38; --rose-ink:#e7c4ba;
  --blue:#34405e; --blue-ink:#bccbf0;
  --pri-high:#7d4338; --pri-high-ink:#f4cabf;
  --pri-mid:#6e5a2f;  --pri-mid-ink:#f0dca5;
  --pri-low:#3c5a47;  --pri-low-ink:#c0e0cc;
}

@keyframes pulse  { 0%{transform:scale(1);opacity:.45} 70%{transform:scale(2.1);opacity:0} 100%{opacity:0} }
@keyframes spin   { to{transform:rotate(360deg)} }
@keyframes fadein { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }
@keyframes sheetup{ from{transform:translateY(100%)} to{transform:none} }

#app {
  height:100%; background:var(--screen); display:flex; flex-direction:column;
  transition:background .3s; max-width:480px; margin:0 auto;
  position:relative; overflow:hidden;
}

.screen-header { padding:14px 18px 12px; flex:none; display:flex; align-items:center; justify-content:space-between; }
.screen-title   { font-size:22px; font-weight:800; color:var(--text); letter-spacing:-.02em; }
.screen-subtitle{ font-size:13px; color:var(--muted); margin-top:2px; font-weight:600; }
.hdr-btns { display:flex; gap:8px; align-items:center; }
.icon-btn {
  width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:none; transition:border-color .2s;
}
.icon-btn:hover { border-color:var(--accent); }
.icon-btn.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }

.scroll-area {
  flex:1; overflow-y:auto; padding:0 18px 80px;
  display:flex; flex-direction:column; gap:14px; scrollbar-width:none;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  overflow-wrap:break-word;
}
.scroll-area::-webkit-scrollbar { display:none; }

.ai-card { background:var(--accent-soft); border-radius:16px; padding:15px 16px; }
.ai-card-hd { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.ai-card-label { font-size:11px; font-weight:800; letter-spacing:.09em; color:var(--accent-ink); }
.ai-card-count { margin-left:auto; font-size:11px; font-weight:700; color:var(--accent-ink); opacity:.8; }
.ai-card-text  { font-size:13.5px; line-height:1.5; color:var(--text); text-wrap:pretty; }
.ai-proc-card  { display:flex; align-items:center; gap:11px; padding:16px; border-radius:16px; background:var(--accent-soft); color:var(--accent-ink); }
.ai-proc-card span { font-weight:700; font-size:14px; }

.tabs { display:flex; gap:5px; background:var(--surface2); padding:4px; border-radius:14px; }
.tab {
  flex:1; padding:9px 4px; border:none; border-radius:11px;
  background:transparent; font-family:inherit; font-weight:700; color:var(--muted); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:background .15s,color .15s,box-shadow .15s;
}
.tab.active { background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.10); }
.tab-label { font-size:12.5px; }
.tab-count { font-size:10px; font-weight:800; opacity:.7; }

.sec-hd { display:flex; align-items:center; gap:8px; padding:0 2px; }
.sec-title { font-size:15px; font-weight:800; color:var(--text); }
.sec-count { font-size:12px; font-weight:700; color:var(--muted); }

.task-list { display:flex; flex-direction:column; gap:9px; }

/* Normal task row */
.task-row {
  display:flex; align-items:stretch; background:var(--surface);
  border:1px solid var(--border); border-radius:14px; overflow:hidden;
  transition:opacity .15s, background .15s;
}
.task-row.dragging { opacity:.3; }
.task-row.drag-over { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
.task-row.sel-active { background:var(--accent-soft); border-color:var(--accent); }

/* Swipe-to-delete */
.task-row-wrap { position:relative; border-radius:14px; overflow:hidden; }
.task-row-wrap .task-row { position:relative; z-index:1; border-radius:14px; will-change:transform; }
.task-row-wrap .task-row.swiping { border-top-right-radius:0; border-bottom-right-radius:0; border-right-color:transparent; }
.swipe-del {
  position:absolute; top:0; right:0; bottom:0; width:96px;
  border:none; background:var(--pri-high); color:var(--pri-high-ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-family:inherit; font-size:11px; font-weight:800; cursor:pointer;
  -webkit-user-select:none; user-select:none;
}

.pri-bar { width:18px; flex:none; border:none; cursor:pointer; padding:0; }
.overdue-sec { border-radius:14px; overflow:hidden; border:1.5px solid var(--pri-high); }
.overdue-sec-hd { display:flex; align-items:center; gap:8px; padding:11px 14px; background:var(--pri-high); cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
.overdue-sec-title { font-size:11px; font-weight:800; letter-spacing:.07em; color:var(--pri-high-ink); flex:1; }
.overdue-sec-body { background:var(--screen); }
.pri-bar[data-pri="high"]{ background:var(--pri-high); }
.pri-bar[data-pri="mid"] { background:var(--pri-mid); }
.pri-bar[data-pri="low"] { background:var(--pri-low); }

.task-body { display:flex; align-items:center; gap:11px; padding:12px 12px 12px 11px; flex:1; min-width:0; }
.chk {
  flex:none; width:24px; height:24px; border-radius:8px; border:2px solid var(--border);
  background:transparent; display:flex; align-items:center; justify-content:center;
  color:#fff; cursor:pointer; padding:0; transition:background .15s,border-color .15s;
}
.chk.done { background:var(--accent); border-color:var(--accent); }
.task-name-zone { flex:1; display:flex; align-items:center; gap:7px; cursor:pointer; min-width:0; }
.task-text { flex:1; font-size:14.5px; font-weight:600; color:var(--text); line-height:1.3; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.task-text.done { text-decoration:line-through; color:var(--muted); opacity:.7; }
.chev { color:var(--muted); opacity:.5; flex:none; }
.pri-chip { flex:none; font-size:10px; font-weight:800; padding:4px 8px; border-radius:7px; }
.pri-chip[data-pri="high"]{ background:var(--pri-high); color:var(--pri-high-ink); }
.pri-chip[data-pri="mid"] { background:var(--pri-mid);  color:var(--pri-mid-ink); }
.pri-chip[data-pri="low"] { background:var(--pri-low);  color:var(--pri-low-ink); }

/* Drag handle */
.drag-handle {
  width:36px; flex:none; border:none; background:transparent;
  color:var(--muted); opacity:.35; cursor:grab; padding:0;
  display:flex; align-items:center; justify-content:center; touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
.drag-handle:active { cursor:grabbing; opacity:.7; }
.task-row {
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

/* Select mode */
.sel-circle {
  flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--border);
  background:transparent; display:flex; align-items:center; justify-content:center;
  color:#fff; transition:background .15s,border-color .15s;
}
.task-row.sel-active .sel-circle { background:var(--accent); border-color:var(--accent); }

/* Select action bar */
.select-bar {
  position:absolute; bottom:56px; left:0; right:0; z-index:5;
  background:var(--surface); border-top:1px solid var(--border);
  padding:10px 18px; display:flex; align-items:center; gap:10px;
}
.sel-count { flex:1; font-size:14px; font-weight:700; color:var(--text); }

/* Touch drag clone */
.touch-clone {
  position:fixed; pointer-events:none; z-index:200;
  opacity:.88; box-shadow:0 12px 32px rgba(0,0,0,.3);
  border-radius:14px; background:var(--surface); border:1px solid var(--accent);
}

/* FAB */
.fab-wrap { position:absolute; right:18px; bottom:76px; width:60px; height:60px; z-index:7; }
.fab-pulse { position:absolute; inset:0; border-radius:50%; background:var(--accent); animation:pulse 1.8s ease-out infinite; pointer-events:none; }
.fab-btn {
  position:relative; width:60px; height:60px; border-radius:50%;
  border:none; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 14px 30px -6px rgba(0,0,0,.34); transition:filter .15s;
}
.fab-btn:hover { filter:brightness(1.06); }
.fab-stop { width:18px; height:18px; background:#fff; border-radius:4px; }
.fab-timer { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; color:var(--text); white-space:nowrap; }
.fab-transcript { position:absolute; bottom:-52px; left:50%; transform:translateX(-50%); font-size:12px; font-weight:700; color:var(--text); white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; background:var(--surface); padding:5px 10px; border-radius:20px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
/* Speed dial */
.fab-dial { position:absolute; bottom:72px; right:0; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
.fab-dial-item { display:flex; align-items:center; gap:10px; animation:fadein .18s ease both; }
.fab-dial-lbl { background:var(--surface); color:var(--text); font-size:13px; font-weight:600; padding:5px 12px; border-radius:20px; box-shadow:0 2px 10px rgba(0,0,0,.15); white-space:nowrap; }
.fab-dial-btn { width:46px; height:46px; border-radius:50%; border:none; background:var(--surface); color:var(--accent); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.22); flex:none; transition:transform .12s; }
.fab-dial-btn:active { transform:scale(.93); }
.fab-scrim { position:fixed; inset:0; z-index:8; background:rgba(0,0,0,.25); }

.bottom-nav {
  position:absolute; bottom:0; left:0; right:0; height:56px;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; z-index:6;
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; border:none; background:transparent; cursor:pointer;
  color:var(--muted); font-family:inherit; font-size:10.5px; font-weight:700;
  transition:color .15s;
}
.nav-btn.active { color:var(--accent); }

/* Calendar */
.cal-view { flex:1; overflow-y:auto; padding:0 18px 80px; display:flex; flex-direction:column; scrollbar-width:none; }
.cal-view::-webkit-scrollbar { display:none; }
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 16px; }
.cal-month-label { font-size:17px; font-weight:800; color:var(--text); }
.cal-nav-btn { width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.cal-nav-btn:hover { border-color:var(--accent); }
.cal-dow { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px; }
.cal-dow-cell { text-align:center; font-size:11px; font-weight:800; color:var(--muted); padding:4px 0; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; cursor:pointer; transition:background .15s; position:relative; gap:3px; }
.cal-cell:hover { background:var(--surface2); }
.cal-cell.today .cal-num { background:var(--accent); color:#fff; }
.cal-cell.selected { background:var(--accent-soft); }
.cal-cell.selected .cal-num { color:var(--accent-ink); font-weight:800; }
.cal-cell.other-month { opacity:.3; pointer-events:none; }
.cal-num { font-size:13px; font-weight:700; color:var(--text); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.cal-dots { display:flex; gap:2px; justify-content:center; height:6px; align-items:center; }
.cal-dot { width:5px; height:5px; border-radius:50%; flex:none; }
.cal-dot[data-pri="high"]{ background:var(--pri-high-ink); opacity:.7; }
.cal-dot[data-pri="mid"] { background:var(--pri-mid-ink);  opacity:.7; }
.cal-dot[data-pri="low"] { background:var(--pri-low-ink);  opacity:.7; }
.cal-dot.done { background:var(--muted); opacity:.4; }

.spin { animation:spin .8s linear infinite; }

/* Sheets / modals */
.overlay { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; justify-content:flex-end; }
.scrim   { position:absolute; inset:0; background:rgba(8,6,12,.46); }
.sheet   { position:relative; background:var(--surface); border-radius:26px 26px 0 0; max-height:92%; display:flex; flex-direction:column; box-shadow:0 -16px 44px -10px rgba(0,0,0,.45); }
.sheet-handle-bar { display:flex; justify-content:center; padding:10px 0 2px; flex:none; }
.sheet-handle { width:38px; height:4px; border-radius:3px; background:var(--border); }
.sheet-body { overflow-y:auto; padding:8px 20px 28px; display:flex; flex-direction:column; gap:15px; scrollbar-width:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; overflow-wrap:break-word; }
.sheet-body::-webkit-scrollbar { display:none; }

.modal-hd { display:flex; align-items:center; gap:8px; }
.sec-pill { font-size:11px; font-weight:800; padding:5px 11px; border-radius:20px; }
.sec-pill[data-sec="day"]  { background:var(--sage); color:var(--sage-ink); }
.sec-pill[data-sec="week"] { background:var(--rose); color:var(--rose-ink); }
.sec-pill[data-sec="month"]{ background:var(--blue); color:var(--blue-ink); }
.sec-pill[data-sec="undated"]{ background:var(--accent-soft); color:var(--accent-ink); }
.modal-chip { font-size:10.5px; font-weight:800; padding:5px 9px; border-radius:8px; }
.close-btn { margin-left:auto; width:31px; height:31px; border-radius:50%; border:none; background:var(--surface2); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-task-title { font-size:20px; font-weight:800; color:var(--text); line-height:1.25; text-wrap:pretty; overflow-wrap:break-word; }
.field-label { font-size:10.5px; font-weight:800; letter-spacing:.07em; color:var(--muted); margin-bottom:6px; text-transform:uppercase; }
.modal-desc    { font-size:14px; line-height:1.55; color:var(--text); }
.modal-no-desc { font-size:14px; line-height:1.5; color:var(--muted); font-style:italic; }
.checklist-progress { font-size:11px; font-weight:700; color:var(--muted); margin-left:6px; }
.checklist-row { display:flex; align-items:center; gap:9px; padding:7px 0; }
.chk-sm {
  flex:none; width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
  background:transparent; display:flex; align-items:center; justify-content:center;
  color:#fff; cursor:pointer; padding:0; transition:background .15s,border-color .15s;
}
.chk-sm.done { background:var(--accent); border-color:var(--accent); }
.checklist-text { flex:1; font-size:14px; color:var(--text); line-height:1.3; }
.checklist-text.done { text-decoration:line-through; color:var(--muted); opacity:.7; }
.checklist-edit-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.checklist-edit-row .form-input { margin:0; }
.checklist-item-del { flex:none; background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; }
.paywall-badge { font-weight:800; font-size:12px; letter-spacing:.06em; background:linear-gradient(135deg,#f6d888,#cf9430); color:#2c2200; padding:4px 11px; border-radius:20px; }
.paywall-title { font-size:20px; font-weight:800; color:var(--text); margin-top:16px; }
.paywall-sub { font-size:14px; color:var(--muted); margin-top:4px; line-height:1.5; }
.paywall-features { list-style:none; margin:18px 0; padding:0; display:flex; flex-direction:column; gap:10px; }
.paywall-features li { display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--text); }
.paywall-features li svg { flex:none; color:#4f7fd6; }
.paywall-price { font-size:22px; font-weight:800; color:var(--text); text-align:center; margin-bottom:14px; }
.paywall-note { font-size:11.5px; color:var(--muted); text-align:center; margin-top:10px; line-height:1.5; }
.edit-hd-title { font-size:17px; font-weight:800; color:var(--text); }

.ai-block { border-radius:16px; padding:13px 14px; background:var(--accent-soft); }
.ai-block-inner { display:flex; align-items:center; gap:11px; }
.ai-mic-wrap { position:relative; width:42px; height:42px; flex:none; }
.ai-mic-pulse { position:absolute; inset:0; border-radius:50%; background:var(--accent); animation:pulse 1.8s ease-out infinite; pointer-events:none; }
.ai-mic-btn { position:relative; width:42px; height:42px; border-radius:50%; border:none; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.ai-mic-stop { width:13px; height:13px; background:#fff; border-radius:3px; }
.ai-text-col   { flex:1; min-width:0; }
.ai-text-title { font-size:13px; font-weight:800; color:var(--accent-ink); }
.ai-text-sub   { font-size:11.5px; color:var(--accent-ink); opacity:.85; line-height:1.4; }
.ai-text-st    { font-size:12px; font-weight:700; color:var(--accent-ink); }
.ai-note { margin-top:10px; padding:9px 11px; border-radius:11px; background:var(--surface); display:flex; align-items:center; gap:8px; }
.ai-note-text { font-size:12px; font-weight:700; color:var(--text); line-height:1.35; }

.modal-actions { display:flex; gap:10px; margin-top:2px; }
.btn-outline { flex:1; padding:13px; border-radius:14px; border:1.5px solid var(--border-strong); background:transparent; color:var(--text); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
.btn-primary { flex:1; padding:13px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-family:inherit; font-size:13.5px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; }
.btn-danger  { flex:1; padding:13px; border-radius:14px; border:1.5px solid var(--pri-high); background:transparent; color:var(--pri-high-ink); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }

.form-input    { width:100%; padding:12px 13px; border-radius:12px; border:1.5px solid var(--border); background:var(--screen); color:var(--text); font-family:inherit; font-size:15px; font-weight:600; outline:none; transition:border-color .15s; }
.form-input:focus { border-color:var(--accent); }
.form-textarea { width:100%; padding:12px 13px; border-radius:12px; border:1.5px solid var(--border); background:var(--screen); color:var(--text); font-family:inherit; font-size:14px; line-height:1.5; resize:none; outline:none; transition:border-color .15s; }
.form-textarea:focus { border-color:var(--accent); }
.form-date     { width:100%; padding:12px 13px; border-radius:12px; border:1.5px solid var(--border); background:var(--screen); color:var(--text); font-family:inherit; font-size:14px; font-weight:600; outline:none; transition:border-color .15s; cursor:pointer; }
.form-date:focus { border-color:var(--accent); }

.pri-picker { display:flex; gap:7px; }
.pri-pick-btn { flex:1; padding:11px 4px; border-radius:11px; border:none; font-family:inherit; font-size:12.5px; font-weight:800; cursor:pointer; transition:box-shadow .15s,opacity .15s; }
.pri-pick-btn[data-pri="high"]{ background:var(--pri-high); color:var(--pri-high-ink); }

.pri-pick-btn[data-pri="low"] { background:var(--pri-low);  color:var(--pri-low-ink); }

.chip-btn { flex:1; padding:9px 6px; border-radius:11px; border:none; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; background:var(--surface2); color:var(--muted); transition:background .15s,color .15s; }
.chip-btn.active { background:var(--accent); color:#fff; font-weight:800; }

.day-sheet-date { font-size:18px; font-weight:800; color:var(--text); }

function applyLang(lang, noRender){
  if(!TRANSLATIONS[lang]) lang='ru';
  var prevLang=state.lang;
  state.lang=lang; L=TRANSLATIONS[lang];
  PRI_LABEL={high:L.pri_high,mid:L.pri_mid,low:L.pri_low};
  TAB_META=[{key:'day',title:L.tab_day},{key:'week',title:L.tab_week},{key:'month',title:L.tab_month}];
  DOW_RU=L.days_short; DOW_FULL=L.days_full; MON_RU=L.months_full; MON_RU_G=L.months_gen;
  EMPTY_HINTS={day:L.empty_day,week:L.empty_week,month:L.empty_month,undated:L.empty_undated};
  try{ localStorage.setItem('vtodo-lang',lang); }catch(e){}
  // Текст push-уведомления собирает СЕРВЕР, а язык он берёт из задачи в
  // момент её сохранения (см. lang в doSyncTasksToServer). Значит после
  // смены языка все УЖЕ заведённые напоминания продолжали бы приходить на
  // старом языке — навсегда, потому что taskSyncSig() язык не учитывает и
  // повторной отправки не происходит (найдено 2026-08-18, когда Александр
  // проверял п.№6 и поставил напоминание ДО переключения языка).
  // Сбрасываем подпись только у задач с активным напоминанием — их единицы,
  // а гонять из-за смены языка ВЕСЬ список значило бы жечь квоту записи KV,
  // которую в этом проекте уже дважды выжигали.
  if(!noRender && prevLang!==lang && isGoogleSignedIn()){
    try{
      var sy=getSyncedTasks(), touched=false;
      allTasks().forEach(function(t){
        if(!t.syncId||!t.reminderTime||!t.date||t.done) return;
        if(sy[t.syncId]){ sy[t.syncId].sig=''; touched=true; } // подпись не совпадёт — уйдёт заново
      });
      if(touched){ saveSyncedTasks(sy); syncRemindersToServer(); }
    }catch(e){}
  }
  if(!noRender){ state.summary=L.summary_default; render(); }
}

// Своя сессия (см. exchangeForSessionToken) живёт 90 дней и обновляется
// через наш сервер (/auth/refresh) — не зависит от капризного Google One
// Tap. Пока сессии ещё нет (первый вход только что случился, обмен ещё не
// прошёл) — используем "сырой" часовой Google-токен как временный запасной
// вариант. Сервер понимает оба формата одинаково (см. verifyAuthToken).
function getSessionToken(){
  try{
    var jwt=localStorage.getItem('vtodo-session-jwt');
    var exp=parseInt(localStorage.getItem('vtodo-session-jwt-exp')||'0');
    if(jwt && exp>Date.now()/1000+30) return jwt;
  }catch(e){}
  return null;
}
function setSessionToken(jwt, exp){
  try{
    localStorage.setItem('vtodo-session-jwt', jwt);
    localStorage.setItem('vtodo-session-jwt-exp', String(exp||0));
  }catch(e){}
}
function sessionTokenExpiringSoon(){
  try{
    var exp=parseInt(localStorage.getItem('vtodo-session-jwt-exp')||'0');
    if(!exp) return false;
    return exp<Date.now()/1000+14*24*3600; // осталось меньше 14 дней
  }catch(e){ return false; }
}
// retryPushIfNeeded: subscribePush() запускается СИНХРОННО в самом начале
// загрузки страницы (см. Init внизу файла) — раньше, чем успевает
// отработать initGoogleSignIn()/maybeRefreshAuth() (он стартует только
// через 300мс ПОСЛЕ window.load, а это уже позже разбора инлайн-скрипта).
// Если в этот ранний момент сохранённая сессия оказалась протухшей,
// subscribePush() честно ставит pushStatus='needAuth' — но потом сессия
// тихо обновляется, а статус так и остаётся «needAuth» навсегда, потому
// что ничего не пробует подписку заново. Юзер видит одновременно зелёное
// "Вошли как email" И жёлтое "Войдите через Google, чтобы получать push" —
// противоречие (найдено 2026-07-29 по скриншоту живого юзера). Как только
// сессия успешно обновилась — если статус именно "needAuth" (а не другая
// причина), пробуем подписку ещё раз.
function retryPushIfNeeded(){ if(state.pushStatus==='needAuth') subscribePush(); }
function exchangeForSessionToken(idToken){
  fetch(WORKER_URL+'/auth/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idToken:idToken})})
    .then(function(r){return r.json();})
    .then(function(data){ if(data && data.token){ setSessionToken(data.token, data.exp); retryPushIfNeeded(); } })
    .catch(function(){});
}
function refreshSessionToken(){
  var tok=getSessionToken();
  if(!tok) return;
  fetch(WORKER_URL+'/auth/refresh',{method:'POST',headers:{'Authorization':'Bearer '+tok}})
    .then(function(r){return r.json();})
    .then(function(data){ if(data && data.token){ setSessionToken(data.token, data.exp); retryPushIfNeeded(); } })
    .catch(function(){});
}

// поймал протухание, а воркер уже отказал 401 authRequired — раньше этот
// путь не распознавался как needAuth, банер "сессия истекла" не появлялся,
// хотя ИИ реально не работал). Единая точка для обоих случаев: если раньше
// уже логинился — ОДНА попытка тихого обновления (без показа окна входа) и
// повтор запроса; если за 2.5с не получилось — честно просим войти.
function handleAuthFailure(retryFn, cb){
  if(hasEverSignedIn() && !pendingAiRetry){
    pendingAiRetry=retryFn;
    silentGoogleRefresh();
    setTimeout(function(){
      if(pendingAiRetry){
        pendingAiRetry=null;
        state.tokenStale=true; if(state.settings) render();
        cb({needAuth:true},null);
      }
    },2500);
    return;
  }
  cb({needAuth:true},null);
}
function callAi(prompt, cb){
  if(!isGoogleSignedIn()){ handleAuthFailure(function(){ callAi(prompt, cb); }, cb); return; }
  if(!canUseAi()){ cb({limit:true},null); return; }
  var fired=false;
  var timer=setTimeout(function(){ if(!fired){ fired=true; cb(new Error('timeout'),null); } },25000);
  function done(err,data){ if(fired) return; fired=true; clearTimeout(timer); refreshAiLimit(); cb(err,data); }
  fetch(WORKER_URL,{
    method:'POST',
    headers:{'content-type':'application/json','Authorization':'Bearer '+getGoogleToken()},
    body:JSON.stringify({messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.error){
      if(data.error.authRequired){
        if(fired) return; fired=true; clearTimeout(timer);
        handleAuthFailure(function(){ callAi(prompt, cb); }, cb);
        return;
      }
      if(data.error.limit){maxOutAiUsage();done({limit:true},null);return;}
      done(new Error(data.error.message),null);return;
    }
    var text=((data.content||[])[0]||{}).text||'';
    var start=text.indexOf('{'); var end=text.lastIndexOf('}');
    if(start<0||end<0){done(new Error('no-json'),null);return;}
    var parsed=JSON.parse(text.slice(start,end+1));
    incrementAiUsage();
    done(null,parsed);
  })
  .catch(function(e){ done(e,null); });
}

  if(t.indexOf(cfg.tomorrow)>=0){ d.setDate(d.getDate()+1); return fmtDate(d); }
  if(t.indexOf(cfg.today)>=0){ return todayStr(); }
  if(t.indexOf(cfg.inTwoWeeks)>=0){ d.setDate(d.getDate()+14); return fmtDate(d); }
  if(t.indexOf(cfg.inWeek)>=0){ d.setDate(d.getDate()+7); return fmtDate(d); }
  if(t.indexOf(cfg.inMonth)>=0){ d.setDate(d.getDate()+30); return fmtDate(d); }
  var m=t.match(cfg.inDaysRe);

  if(dm){ var day=parseInt(dm[1]); var cur=d.getDate(); var target=new Date(d.getFullYear(),d.getMonth(),day); if(day<cur) target.setMonth(target.getMonth()+1); return fmtDate(target); }

  // в списке дел), но из раздела «Задачи» приходит fallback='' — там дело
  // бессрочное, пока пользователь не сказал «завтра»/«в понедельник» и т.п.
  return fallback===undefined?todayStr():fallback;

function localParseTime(text){
  var cfg=localParseCfg();
  var t=text.toLowerCase();
  var m=t.match(cfg.timeHMRe);
  if(m){
    var hh=parseInt(m[1]);
    if(cfg.ampmGroup && m[3]){ if(m[3]==='pm'&&hh<12) hh+=12; if(m[3]==='am'&&hh===12) hh=0; }
    return pad(hh)+':'+m[2];
  }
  m=t.match(cfg.timeHourRe);
  if(m){
    var h=parseInt(m[1]);
    if(cfg.pmWord && t.indexOf(cfg.pmWord)>=0 && h<12) h+=12;
    if(cfg.ampmGroup && m[2]){ if(m[2]==='pm'&&h<12) h+=12; if(m[2]==='am'&&h===12) h=0; }
    return pad(h)+':00';
  }
  if(cfg.noonWord && t.indexOf(cfg.noonWord)>=0) return '12:00';
  if(cfg.midnightWord && t.indexOf(cfg.midnightWord)>=0) return '00:00';

function localCleanText(text){
  var cfg=localParseCfg();
  var t=text;
  cfg.cleanPatterns.forEach(function(p){ t=t.replace(p[0],p[1]); });
  t=t.replace(/\s+/g,' ').trim();
  cfg.leadingStrip.forEach(function(re){ t=t.replace(re,''); });
  t=t.trim();

  var today=todayStr();
  return state.sections.day.filter(function(t){ return t.date&&t.date<today&&!t.done; });

  var today=todayStr();
  // Ветка `!t.date` выглядит мёртвой (аудит 2026-08-17 так её и пометил):
  // dateToSection('') возвращает 'undated', а rebalanceSections() гоняется при
  // старте и при каждом возврате в приложение, так что бездатная задача в day
  // оказаться не должна. ОСТАВЛЕНА СОЗНАТЕЛЬНО как страховка: getOverdueTasks()
  // требует непустой t.date, поэтому без этого условия задача с пустой датой,
  // если она всё же попадёт в day, не попадёт НИ в «Сегодня», НИ в
  // «Просрочено» — то есть исчезнет с экрана, продолжая лежать в данных.
  // Пропажа задач в этом проекте уже была настоящим багом; цена страховки —
  // одно лишнее условие, цена ошибки — «у меня пропали задачи».

/* ── Свои шторки вместо системных confirm()/prompt() (2026-08-17) ──
   В НАТИВНОЙ (WebView) сборке системные диалоги молча не работают: там задан
   свой WebChromeClient (для микрофона), а базовые onJsConfirm/onJsPrompt
   возвращают false/null — то есть confirm() СРАЗУ отдаёт false, а prompt()
   null, без всякого окна. В TWA (Chrome) они работали, поэтому баг было не
   видно на боевой версии: в WebView же молча ломались выход из группы,
   удаление группы/участника/задачи, переименование и удаление пунктов
   чек-листа (аудит 2026-08-17). Плюс системные окна и в TWA выглядели
   чужеродно. Решение общее для обеих версий — свои шторки в том же стиле,
   что и остальное приложение; в Kotlin дублировать ничего не нужно.
   Коллбэк держим в модульной переменной, а НЕ в state: state сериализуется
   в localStorage (saveStorage), функция туда не пишется. */
var _askFn=null, _askAltFn=null;
// Выбор из ТРЁХ вариантов. Двух здесь мало: при «сохранить / не сохранять»
// случайный тап мимо шторки означал бы потерю правок, а третий вариант
// (просто вернуться) делает промах безопасным.
function askChoice(text,okLabel,onOk,altLabel,onAlt){
  state.ask={mode:'confirm',text:text,danger:false,value:'',okLabel:okLabel,altLabel:altLabel};
  _askFn=onOk; _askAltFn=onAlt; anim.ask=true; render();
}
function askAlt(){
  var fn=_askAltFn; _askFn=null; _askAltFn=null;
  state.ask=null; render();
  if(fn) fn();
}
function askConfirm(text,danger,fn,okLabel){
  state.ask={mode:'confirm',text:text,danger:!!danger,value:'',okLabel:okLabel||''};
  _askFn=fn; anim.ask=true; render();
}
function askPrompt(text,initial,fn){
  state.ask={mode:'prompt',text:text,danger:false,value:initial||''};
  _askFn=fn; anim.ask=true; render();
}
function askCancel(){ _askFn=null; _askAltFn=null; state.ask=null; render(); }
function askOk(){
  var fn=_askFn, a=state.ask;
  _askFn=null; _askAltFn=null;
  var val=a?a.value:'';
  state.ask=null; render();
  // Коллбэк ПОСЛЕ закрытия шторки: внутри он часто сам зовёт render()
  // (или ещё одну шторку), и порядок «сначала убрать, потом действовать»
  // избавляет от мигания двух наложенных оверлеев.
  if(fn) fn(a&&a.mode==='prompt'?val:true);
}
function renderAsk(){
  var a=state.ask; if(!a) return '';
  var sa=anim.ask?' style="animation:fadein .2s ease both"':'';
  var sha=anim.ask?' style="animation:sheetup .28s cubic-bezier(.2,.8,.2,1) both"':'';
  var okStyle=a.danger?' style="background:var(--pri-high-ink)"':'';
  // Своя подпись кнопки, если задана (например «Выйти») — иначе «Удалить» у опасных действий и «Подтвердить» у остальных.
  var okLabel=a.okLabel?esc(a.okLabel):(a.danger?(IC.trash+' '+L.btn_delete):L.btn_confirm);
  return '<div class="overlay" style="z-index:50">'+
    '<div class="scrim" data-role="ask-cancel"'+sa+'></div>'+
    '<div class="sheet" data-sheet="ask"'+sha+'>'+
      '<div class="sheet-handle-bar"><span class="sheet-handle"></span></div>'+
      '<div class="sheet-body">'+
        '<div style="font-size:15.5px;font-weight:700;color:var(--text);line-height:1.5">'+esc(a.text)+'</div>'+
        (a.mode==='prompt'
          ?'<input id="ask-input" class="form-input" maxlength="120" value="'+escA(a.value)+'">'
          :'')+
        (a.altLabel
          ?'<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">'+
             '<button class="btn-primary" data-role="ask-ok">'+esc(a.okLabel||L.btn_confirm)+'</button>'+
             '<button class="btn-outline" data-role="ask-alt">'+esc(a.altLabel)+'</button>'+
             '<button class="btn-outline" style="border:none;color:var(--muted)" data-role="ask-cancel">'+L.btn_cancel+'</button>'+
           '</div>'
          :'<div class="modal-actions" style="margin-top:4px">'+
             '<button class="btn-outline" data-role="ask-cancel">'+L.btn_cancel+'</button>'+
             '<button class="btn-primary"'+okStyle+' data-role="ask-ok">'+okLabel+'</button>'+
           '</div>')+
      '</div>'+
    '</div></div>';
}

function renderCalendar(){
  var year=state.calYear, month=state.calMonth;
  var firstDay=new Date(year,month,1);
  var startDow=firstDay.getDay(); startDow=(startDow+6)%7;
  var daysInMonth=new Date(year,month+1,0).getDate();
  var daysInPrev=new Date(year,month,0).getDate();
  var today=todayStr();
  var cells='';
  var totalCells=Math.ceil((startDow+daysInMonth)/7)*7;
  for(var i=0;i<totalCells;i++){
    var day,dateStr,otherMonth=false;
    if(i<startDow){ day=daysInPrev-startDow+i+1; var pm=month-1<0?11:month-1; var py=month-1<0?year-1:year; dateStr=py+'-'+pad(pm+1)+'-'+pad(day); otherMonth=true; }
    else if(i>=startDow+daysInMonth){ day=i-startDow-daysInMonth+1; var nm=month+1>11?0:month+1; var ny=month+1>11?year+1:year; dateStr=ny+'-'+pad(nm+1)+'-'+pad(day); otherMonth=true; }
    else{ day=i-startDow+1; dateStr=year+'-'+pad(month+1)+'-'+pad(day); }
    var isToday=dateStr===today;
    var isSel=dateStr===state.calSelected;
    var dayTasks=tasksForDate(dateStr);
    var cls='cal-cell'+(otherMonth?' other-month':'')+(isToday?' today':'')+(isSel?' selected':'');
    var dots=''; var shown=dayTasks.slice(0,3);
    for(var dd=0;dd<shown.length;dd++) dots+='<span class="cal-dot'+(shown[dd].done?' done':'')+'" data-pri="'+shown[dd].priority+'"></span>';
    cells+='<div class="'+cls+'" data-role="cal-day" data-date="'+dateStr+'">'+
      '<span class="cal-num">'+day+'</span>'+
      (dots?'<div class="cal-dots">'+dots+'</div>':'<div style="height:6px"></div>')+
    '</div>';
  }
  return '<div class="cal-view">'+
    '<div class="cal-nav">'+
      '<button class="cal-nav-btn" data-role="cal-prev">'+IC.chevL+'</button>'+
      '<span class="cal-month-label">'+MON_RU[month]+' '+year+'</span>'+
      '<button class="cal-nav-btn" data-role="cal-next">'+IC.chevRb+'</button>'+
    '</div>'+
    '<div class="cal-dow">'+DOW_RU.map(function(d){return '<span class="cal-dow-cell">'+d+'</span>';}).join('')+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
  '</div>';
}

  var sa=anim.gEdit?' style="animation:fadein .2s ease both"':'';
  var sha=anim.gEdit?' style="animation:sheetup .3s cubic-bezier(.2,.8,.2,1) both"':'';
  var priBtns=PRI_ORDER.map(function(k){
    return '<button class="pri-pick-btn'+(ed.priority===k?' sel':'')+'" data-pri="'+k+'" data-role="g-set-pri">'+PRI_LABEL[k]+'</button>';
  }).join('');
  var checklistHtml=(ed.checklist||[]).map(function(c){
    return '<div class="checklist-item">'+
      '<button class="chk'+(c.done?' done':'')+'" data-role="g-toggle-cl-item" data-item="'+escA(c.id)+'">'+(c.done?IC.check:'')+'</button>'+
      '<span class="checklist-item-text'+(c.done?' done':'')+'">'+esc(c.text)+'</span>'+
      '<button class="close-btn" data-role="g-del-cl-item" data-item="'+escA(c.id)+'">'+IC.close+'</button>'+

  }).join('');
  var membersHtml=ed.reminderTime
    ?'<div>'+
        '<div class="field-label">'+L.groups_notify_lbl+'</div>'+
        (state.groupMembers.length?state.groupMembers.map(function(m){
          var checked=ed.notify.indexOf(m.uid)!==-1;
          return '<button class="chip-btn'+(checked?' active':'')+'" style="font-size:11px;padding:5px 8px;margin:0 6px 6px 0" data-role="g-toggle-notify" data-uid="'+escA(m.uid)+'">'+(checked?IC.check+' ':'')+esc(m.uid===getUserKey()?L.groups_you:displayUid(m.uid))+'</button>';
        }).join(''):IC.spin(16))+

    :'';

    '<div class="scrim" data-role="g-edit-cancel"'+sa+'></div>'+
    '<div class="sheet" data-sheet="gedit" data-sheet-drag="gedit"'+sha+'>'+
      '<div class="sheet-handle-bar"><span class="sheet-handle"></span></div>'+
      '<div class="sheet-body">'+
        '<div>'+
          '<div class="field-label">'+L.field_name+'</div>'+
          '<input id="g-edit-text" class="day-add-input" style="width:100%;box-sizing:border-box" maxlength="120" value="'+escA(ed.text)+'">'+
        '</div>'+
        '<div style="display:flex;gap:10px">'+
          '<div style="flex:1">'+
            '<div class="field-label">'+L.field_date+'</div>'+
            '<input id="g-edit-date" type="date" class="day-add-input" style="width:100%;box-sizing:border-box" value="'+escA(ed.date)+'">'+
          '</div>'+
          '<div style="flex:1">'+
            '<div class="field-label">'+L.field_remind+'</div>'+
            '<input id="g-edit-remind" type="time" class="day-add-input" style="width:100%;box-sizing:border-box" value="'+escA(ed.reminderTime)+'">'+
          '</div>'+
        '</div>'+
        membersHtml+
        '<div>'+
          '<div class="field-label">'+L.priority+'</div>'+
          '<div class="pri-picker">'+priBtns+'</div>'+
        '</div>'+
        '<div>'+
          '<div class="field-label">'+L.desc+'</div>'+
          '<textarea id="g-edit-desc" class="day-add-input" style="width:100%;box-sizing:border-box;min-height:60px;resize:vertical" maxlength="500">'+esc(ed.desc)+'</textarea>'+
        '</div>'+

          checklistHtml+
          '<div style="display:flex;gap:8px;margin-top:6px">'+
            '<input id="g-edit-cl-new" class="day-add-input" style="flex:1;box-sizing:border-box" placeholder="'+escA(L.checklist_add_ph)+'" maxlength="40" value="'+escA(state.gEditNewItem)+'">'+
            '<button class="btn-outline" style="flex:none" data-role="g-add-cl-item">'+L.checklist_add_btn+'</button>'+

// Управление группой одной шторкой. Раньше эти кнопки жили прямо над списком
// задач и занимали пол-экрана — человек открывал группу и первым делом видел
// «Участники / Корзина / Выйти / Удалить / Уведомления», а не свои задачи.
function renderGroupSettingsSheet(){
  if(!state.gSettings||!state.groupOpen) return '';
  var g=state.groupOpen;
  var sa=anim.gSettings?' style="animation:fadein .2s ease both"':'';
  var sha=anim.gSettings?' style="animation:sheetup .28s cubic-bezier(.2,.8,.2,1) both"':'';
  var row=function(role,label,extra){
    return '<button class="btn-outline" style="width:100%;font-size:13.5px;text-align:left;padding:13px 14px'+(extra||'')+'" data-role="'+role+'">'+label+'</button>';
  };
  return '<div class="overlay" style="z-index:38">'+
    '<div class="scrim" data-role="group-settings-close"'+sa+'></div>'+
    '<div class="sheet" data-sheet="gsettings"'+sha+'>'+
      '<div class="sheet-handle-bar"><span class="sheet-handle"></span></div>'+
      '<div class="sheet-body">'+
        '<div class="modal-hd">'+
          '<span class="edit-hd-title">'+esc(g.name)+'</span>'+
          '<span class="pri-chip" data-pri="mid" style="margin-left:8px">'+esc(groupRoleLabel(g.role))+'</span>'+
          '<button class="close-btn" data-role="group-settings-close">'+IC.close+'</button>'+
        '</div>'+
        // Уведомления — единственное, что доступно ВСЕМ ролям: читать может
        // каждый, значит и знать о новых задачах вправе каждый.
        '<button class="chip-btn'+(g.notifyNew?' active':'')+'" style="width:100%;font-size:13px;padding:12px" data-role="group-toggle-notify-new">'+(g.notifyNew?'🔔 ':'🔕 ')+esc(L.groups_notify_new)+'</button>'+
        (g.isAdmin
          ?row('group-rename',L.groups_rename_btn)+
           row('group-open-members',L.groups_members_btn)+
           row('group-open-trash',L.groups_trash_btn)
          :'')+
        row('group-leave',L.groups_leave_btn)+
        (g.isAdmin?row('group-delete-group',L.groups_delete_group_btn,';color:var(--pri-high-ink);border-color:var(--pri-high)'):'')+
      '</div>'+
    '</div></div>';
}

function renderGroupTasksScreen(){
  var g=state.groupOpen;
  var canEdit=g.role==='admin'||g.role==='editor';
  var canCheck=g.role!=='viewer';
  var canAdd=canEdit;
  var rows=state.groupTasks.map(function(t){ return renderGroupTaskRowCustom(t,canEdit,g.role==='admin',canCheck); }).join('');
  return '<div class="scroll-area" style="padding-bottom:80px">'+
      '<div class="sec-hd">'+
        '<button class="icon-btn" data-role="group-close">'+IC.chevL+'</button>'+
        '<span class="sec-title">'+esc(g.name)+'</span>'+
        '<span class="pri-chip" data-pri="mid" style="margin-left:8px">'+esc(groupRoleLabel(g.role))+'</span>'+
        // Всё управление группой съехало сюда, под шестерёнку (просьба
        // Александра 2026-08-19). До этого над списком задач висело пять
        // кнопок — участники, корзина, выйти, удалить, уведомления — и они
        // занимали пол-экрана раньше, чем человек видел сами задачи.
        '<button class="icon-btn" style="margin-left:auto" data-role="group-settings" title="'+escA(L.groups_settings_title)+'">'+IC.gear+'</button>'+
      '</div>'+
      // Пояснение для ограниченных ролей ОСТАВЛЕНО на экране: это не кнопка,
      // а ответ на вопрос «почему я ничего не могу», и прятать его в меню
      // значит не показать тому, кому оно как раз и нужно.
      (g.role==='viewer_check'||g.role==='viewer'
        ?'<div class="info-box" style="background:var(--surface2);margin:0 4px 10px">'+esc(g.role==='viewer_check'?L.groups_role_hint_check:L.groups_role_hint_view)+'</div>'
        :'')+
      (canAdd
        ?'<div style="display:flex;gap:8px;padding:0 4px 10px">'+
            '<input id="g-add-input" class="day-add-input" style="flex:1;box-sizing:border-box" placeholder="'+escA(L.groups_add_task_ph)+'" maxlength="120" value="'+escA(state.gAddText)+'">'+
            '<button class="btn-primary" style="flex:none;padding:0 14px" data-role="group-add-task">'+IC.plus+'</button>'+
          '</div>'
        :'')+
      (!state.groupTasksLoaded
        ?'<div style="padding:28px 0;text-align:center;color:var(--muted);font-size:13.5px">'+IC.spin(18)+'</div>'
        :(state.groupTasks.length
          ?'<div class="task-list" style="padding:0 4px">'+rows+'</div>'
          :'<div style="padding:28px 0;text-align:center;color:var(--muted);font-size:13.5px;font-weight:600">'+L.groups_no_tasks+'</div>')
      )+
    '</div>';
}

/* ── Main render ── */
function render(){
  var savedScroll=0;
  var sheetEl=document.querySelector('.sheet-body');
  if(sheetEl) savedScroll=sheetEl.scrollTop;

  var app=document.getElementById('app');
  app.dataset.theme=state.theme;
  var themeColorMeta=document.getElementById('theme-color-meta');
  if(themeColorMeta) themeColorMeta.content=state.theme==='dark'?'#1a1922':'#f5f2ec';

  var activeTasks=state.tab==='day'?getTodayOnlyTasks():(state.sections[state.tab]||[]);
  var activeTitle=L.tab_day;
  for(var i=0;i<TAB_META.length;i++) if(TAB_META[i].key===state.tab){activeTitle=TAB_META[i].title;break;}
  var ss=anim.summary?' style="animation:fadein .3s ease both"':'';

  var taskListHtml;
  if(activeTasks.length){
    taskListHtml=activeTasks.map(function(t){return renderTaskRow(t,state.tab);}).join('');
  }else if(state.tab==='day'&&getOverdueTasks().length){
    // Просроченные уже показаны отдельным блоком выше — доп. "задач нет" не нужно,
    // иначе одновременно видно и счётчик "1", и надпись "задач нет" — противоречиво.
    taskListHtml='';
  }else{
    taskListHtml='<div style="padding:28px 0;text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.6"><div style="font-size:28px;margin-bottom:10px">✓</div>'+EMPTY_HINTS[state.tab]+'</div>';
  }

  /* Header: normal vs selectMode */
  var hdr = state.selectMode
    ? '<div class="screen-header">'+
        '<div><div class="screen-title">'+L.select_hd+'</div><div class="screen-subtitle">'+L.select_hint+'</div></div>'+
        '<div class="hdr-btns"><button class="btn-outline" style="padding:8px 16px;border-radius:20px;font-size:13px" data-role="exit-select">'+L.select_done+'</button></div>'+
      '</div>'
    : '<div class="screen-header">'+
        '<div><div class="screen-title">'+L.app_name+'</div><div class="screen-subtitle">'+todayLabel()+'</div></div>'+
        '<div class="hdr-btns">'+
          '<button class="icon-btn active" data-role="toggle-settings" title="Настройки">'+IC.gear+'</button>'+
          '<button class="icon-btn'+(activeTasks.length&&state.view==='list'?' ':' ')+'" data-role="enter-select" title="Выбрать задачи" style="'+(activeTasks.length&&state.view==='list'?'':'opacity:.4;pointer-events:none')+'">'+IC.sel+'</button>'+
          '<button class="icon-btn" data-role="toggle-theme">'+(state.theme==='light'?IC.moon:IC.sun)+'</button>'+
        '</div>'+
      '</div>';

  var answerCard=state.aiAnswer
    ?'<div class="ai-answer-card">'+
        '<div class="ai-card-hd">'+IC.spark('style="color:var(--accent-ink)"')+'<span class="ai-card-label">'+L.ai_ans_label+'</span>'+
        '<button class="close-btn" style="margin-left:auto" data-role="close-answer">'+IC.close+'</button></div>'+
        '<p class="ai-answer-txt">'+esc(state.aiAnswer)+'</p>'+
      '</div>'
    :'';

  var listContent=
    '<div class="scroll-area" style="padding-bottom:'+(state.selectMode?'140px':'80px')+'">'+
      (state.processing
        ?'<div class="ai-proc-card">'+IC.spin(18)+'<span>'+L.ai_proc_long+'</span></div>'
        :'<div class="ai-card"'+ss+'><div class="ai-card-hd">'+IC.spark('style="color:var(--accent-ink)"')+'<span class="ai-card-label">'+L.ai_label+'</span><span class="ai-card-count">'+totalTasks()+' '+L.tasks_word+'</span>'+'<button data-role="ai-analyze" style="margin-left:auto;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:700;color:var(--accent-ink);padding:5px 12px;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);opacity:'+(state.aiAnalyzing?'0.5':'1')+'">'+(state.aiAnalyzing?'…':'↻ '+L.analyze_btn)+'</button>'+'</div><p class="ai-card-text">'+esc(state.summary)+'</p></div>')+
      answerCard+
      renderDueBanner()+
      '<div class="tabs">'+TAB_META.map(function(m){
        var tabCnt=m.key==='day'?(getTodayOnlyTasks().length+getOverdueTasks().length):state.sections[m.key].length;
        return '<button class="tab'+(state.tab===m.key?' active':'')+'" data-role="set-tab" data-tab="'+m.key+'"><span class="tab-label">'+m.title+'</span><span class="tab-count">'+tabCnt+'</span></button>';
      }).join('')+'</div>'+
      '<div class="sec-hd"><span class="sec-title">'+activeTitle+'</span><span class="sec-count">'+(state.tab==='day'?(getTodayOnlyTasks().length+getOverdueTasks().length):activeTasks.length)+'</span></div>'+
      (state.tab==='day'?renderOverdueSection():'')+
      '<div class="task-list" id="task-list" data-sec="'+state.tab+'">'+taskListHtml+'</div>'+

  // pointer-events:none пропускает тап насквозь, к видимой кнопке под ним.
